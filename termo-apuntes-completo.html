/* ============================================================
   RANKINE COMPUTATION & RENDERING
   ============================================================ */
function calcRankine(){
  const{v,pb,tm,pc,prh}=S.rk;
  // pb in bar→ kPa*100; pc in kPa; tm in °C; prh in bar
  const P_bo=pb*100,P_co=pc,T_max=tm;
  // Saturation states at boiler and condenser
  const sat_co=waterSatAtP(P_co); // [T,P,vf,vg,sf,sg,hf,hg]
  const sat_bo=waterSatAtP(P_bo);
  const T_co=sat_co[0],hf_co=sat_co[6],hg_co=sat_co[7],sf_co=sat_co[4],sg_co=sat_co[5],vf_co=sat_co[2];
  const T_bo=sat_bo[0],hf_bo=sat_bo[6],hg_bo=sat_bo[7],sf_bo=sat_bo[4],sg_bo=sat_bo[5];
  // State 1: sat liquid @ condenser P
  const h1=hf_co,s1=sf_co;
  // State 2: pump exit, h2 ≈ h1 + vf·(P2-P1)
  const wp=vf_co*(P_bo-P_co); // kJ/kg (kPa·m³/kg)
  const h2=h1+wp,s2=s1;
  // State 3: superheated at P_bo and T_max
  // Approx: h3 = hg_bo + cp_vapor*(T_max - T_bo); s3 = sg_bo + cp_vapor*ln((T_max+273)/(T_bo+273))
  const cp_steam=2.0; // approx kJ/kg·K for superheated steam
  const h3=hg_bo+cp_steam*(T_max-T_bo);
  const s3=sg_bo+cp_steam*Math.log((T_max+273.15)/(T_bo+273.15));
  // State 4: isentropic to P_co (s4=s3)
  // If s3 > sg_co: superheated at exit. Otherwise: wet mix, x=(s3-sf_co)/(sg_co-sf_co)
  let h4,x4;
  if(s3>sg_co){
    // Superheated at exit (unlikely in Rankine but possible)
    h4=hg_co+cp_steam*0.5*(s3-sg_co);
    x4=1;
  }else{
    x4=(s3-sf_co)/(sg_co-sf_co);
    h4=hf_co+x4*(hg_co-hf_co);
  }
  // Reheat correction
  if(v==='reheat'||v==='rr'){
    // Two-stage turbine: HP from P_bo to P_rh, then reheat to T_max, then LP to P_co
    const P_rh=prh*100;
    const sat_rh=waterSatAtP(P_rh);
    const cp_st=cp_steam;
    // After HP isentropic: T_after_HP ≈ T_max * (P_rh/P_bo)^((γ-1)/γ_steam~0.25)
    const T_hp_out=Math.max(sat_rh[0],T_max*Math.pow(P_rh/P_bo,0.25));
    const h_hp_out=h3*Math.pow(P_rh/P_bo,0.15); // rough
    // After reheat: T back to T_max at P_rh
    const h_rh_out=sat_rh[7]+cp_st*(T_max-sat_rh[0]);
    const s_rh_out=sat_rh[5]+cp_st*Math.log((T_max+273)/(sat_rh[0]+273));
    // LP isentropic from P_rh to P_co
    if(s_rh_out>sg_co){h4=hg_co+cp_st*0.5*(s_rh_out-sg_co);x4=1;}
    else{x4=(s_rh_out-sf_co)/(sg_co-sf_co);h4=hf_co+x4*(hg_co-hf_co);}
    // Total turbine work
    const wt_hp=h3-h_hp_out;
    const wt_lp=h_rh_out-h4;
    const wt=wt_hp+wt_lp;
    const qin=(h3-h2)+(h_rh_out-h_hp_out);
    const eta=(wt-wp)/qin;
    const carnot=1-(T_co+273.15)/(T_max+273.15);
    return{eta:Math.max(0,Math.min(.55,eta)),wt,wp,qin,x:x4,carnot,TK:T_max+273.15,Tc:T_co+273.15,h1,h2,h3,h4};
  }
  // Regeneration bonus
  let eta_bonus=0,wp_extra=0;
  if(v==='regen'||v==='rr'){eta_bonus=0.04;wp_extra=wp*0.3;}
  if(v==='closed'){eta_bonus=0.035;}
  if(v==='super'&&pb>180){eta_bonus+=0.05;}
  // Simple cycle calc
  const wt=h3-h4;
  const qin=h3-h2;
  const wnet=wt-wp;
  const eta=wnet/qin+eta_bonus;
  const carnot=1-(T_co+273.15)/(T_max+273.15);
  return{eta:Math.max(0,Math.min(.55,eta)),wt,wp:wp+wp_extra,qin,x:Math.max(0.6,Math.min(1,x4)),carnot,TK:T_max+273.15,Tc:T_co+273.15,h1,h2,h3,h4};
}

function drawRTS(d){
  const svg=document.getElementById('rts');if(!svg)return;clr(svg);
  const W=360,H=300,ML=48,MR=14,MT=18,MB=36;
  svgEl(svg,'line',{x1:ML,y1:H-MB,x2:W-MR,y2:H-MB,stroke:'#9AA0AE'});
  svgEl(svg,'line',{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:'#9AA0AE'});
  svgEl(svg,'text',{x:W-MR,y:H-MB+16,'text-anchor':'end','font-size':11,fill:'#4A5168'},'s [kJ/kg·K]');
  svgEl(svg,'text',{x:ML-8,y:MT+4,'font-size':11,fill:'#4A5168','text-anchor':'end'},'T [°C]');
  const Tmax=700,smin=0,smax=9.5;
  function px(s){return ML+(s-smin)/(smax-smin)*(W-ML-MR)}
  function py(T){return H-MB-(T/Tmax)*(H-MT-MB)}
  // Grid
  [100,200,300,400,500,600].forEach(T=>{
    svgEl(svg,'line',{x1:ML,y1:py(T),x2:W-MR,y2:py(T),stroke:'#EEF0F4','stroke-width':.5});
    svgEl(svg,'text',{x:ML-4,y:py(T)+3,'text-anchor':'end','font-size':9,fill:'#9AA0AE'},T);
  });
  [2,4,6,8].forEach(s=>{
    svgEl(svg,'line',{x1:px(s),y1:MT,x2:px(s),y2:H-MB,stroke:'#EEF0F4','stroke-width':.5});
    svgEl(svg,'text',{x:px(s),y:H-MB+14,'text-anchor':'middle','font-size':9,fill:'#9AA0AE'},s);
  });
  // Real saturation dome from WATER_SAT (sf, sg columns)
  const liqPts=WATER_SAT.map(r=>`${px(r[4])},${py(r[0])}`).join(' ');
  const vapPts=WATER_SAT.slice().reverse().map(r=>`${px(r[5])},${py(r[0])}`).join(' ');
  svgEl(svg,'polyline',{points:liqPts,fill:'none',stroke:'#0369A1','stroke-width':2});
  svgEl(svg,'polyline',{points:vapPts,fill:'none',stroke:'#C84B1A','stroke-width':2});
  const cr=WATER_SAT[WATER_SAT.length-1];
  svgEl(svg,'circle',{cx:px(cr[4]),cy:py(cr[0]),r:4,fill:'#C84B1A',stroke:'#fff','stroke-width':1.5});
  svgEl(svg,'text',{x:px(cr[4])+6,y:py(cr[0])-4,'font-size':9,fill:'#C84B1A'},'PC');
  // Approximate Rankine cycle path  
  const v=S.rk.v,Tmax_cyc=S.rk.tm,P_b=S.rk.pb,P_c=S.rk.pc;
  const sat_cond=waterSatAtP(P_c);
  const sat_bo=waterSatAtP(P_b*100);
  const T_cond=sat_cond[0],sf_cond=sat_cond[4],sg_cond=sat_cond[5];
  const T_sat_bo=sat_bo[0],sf_bo=sat_bo[4],sg_bo=sat_bo[5];
  // States: 1=pump in (sat liq @cond), 2=pump out (subcooled, same s ≈sf_cond), 3a=sat liq @boiler, 3b=sat vap @boiler, 4=superheated, 5=turb exit @cond
  const s1=sf_cond, T1=T_cond;
  const s2=s1, T2=T_cond+5;
  const s3a=sf_bo, T3a=T_sat_bo;
  const s3b=sg_bo, T3b=T_sat_bo;
  const s4=sg_bo+0.0015*(Tmax_cyc-T_sat_bo), T4=Tmax_cyc;
  // Turbine exit ideal: s5=s4, find x at P_cond
  const s5=s4, T5=T_cond;
  // Draw cycle
  function line(s1,T1,s2,T2,col,w){
    svgEl(svg,'line',{x1:px(s1),y1:py(T1),x2:px(s2),y2:py(T2),stroke:col,'stroke-width':w||2.5})
  }
  function curveIsobar(P_kPa,s_start,s_end,col){
    // saturation curve along the dome at constant P (just horizontal in two-phase)
    const sat=waterSatAtP(P_kPa);
    const T=sat[0];
    line(s_start,T,s_end,T,col,2.5);
  }
  // 1→2 pump (isentropic vertical)
  line(s1,T1,s2,T2,'#0369A1',2);
  // 2→3a economizer (heating liquid to sat)
  line(s2,T2,s3a,T3a,'#C84B1A',2);
  // 3a→3b boiling (horizontal at T_sat_bo)
  line(s3a,T3a,s3b,T3b,'#C84B1A',3);
  // 3b→4 superheating
  line(s3b,T3b,s4,T4,'#C84B1A',2);
  // Optional reheat (variant=reheat or rr)
  let s4_end=s4, T4_end=T4;
  if(v==='reheat'||v==='rr'){
    const P_rh=S.rk.prh*100;
    const sat_rh=waterSatAtP(P_rh);
    const T_rh_sat=sat_rh[0];
    const s_rh_mid=s4+0.5; // expansion in HP
    const T_rh_mid=Math.max(T_rh_sat,T4*0.65);
    line(s4,T4,s_rh_mid,T_rh_mid,'#1CBBBB',2);
    // Reheat to Tmax
    line(s_rh_mid,T_rh_mid,s_rh_mid+0.4,T4,'#C84B1A',2);
    s4_end=s_rh_mid+0.4; T4_end=T4;
  }
  // 4→5 turbine (isentropic, vertical drop)
  line(s4_end,T4_end,s5+(s4_end-s4),T5,'#1CBBBB',2);
  const s5_real=s5+(s4_end-s4);
  // 5→1 condensation (horizontal at T_cond)
  line(s5_real,T5,s1,T1,'#0369A1',3);
  // State dots
  [[s1,T1,'1'],[s2,T2,'2'],[s3a,T3a,'3a'],[s3b,T3b,'3b'],[s4,T4,'4'],[s5_real,T5,'5']].forEach(([s,T,l])=>{
    svgEl(svg,'circle',{cx:px(s),cy:py(T),r:4,fill:'#1CBBBB',stroke:'#fff','stroke-width':1.2});
    svgEl(svg,'text',{x:px(s)+5,y:py(T)-4,'font-size':9,fill:'#138F8F','font-weight':700},l);
  });
  // Regen bleed isobar
  if((v==='regen'||v==='closed'||v==='rr')&&S.rk.prh>0){
    const P_bl_kPa=S.rk.prh*100;
    const sat_bl=waterSatAtP(P_bl_kPa);
    const T_bl=sat_bl[0],sf_bl=sat_bl[4],sg_bl=sat_bl[5];
    svgEl(svg,'line',{x1:px(sf_bl),y1:py(T_bl),x2:px(sg_bl),y2:py(T_bl),
      stroke:'#1CBBBB','stroke-width':1.8,'stroke-dasharray':'6,3'});
    svgEl(svg,'text',{x:px(sg_bl)+5,y:py(T_bl)-2,'font-size':9,fill:'#1CBBBB','font-weight':600},
      `P=${S.rk.prh}bar`);
    if(T_bl>T5&&T_bl<T4_end){
      svgEl(svg,'circle',{cx:px(s4_end),cy:py(T_bl),r:4,fill:'#fff',stroke:'#1CBBBB','stroke-width':1.8});
      svgEl(svg,'text',{x:px(s4_end)+6,y:py(T_bl)-3,'font-size':8,fill:'#1CBBBB'},'extr.');
    }
  }
}

function drawRSchema(){
  const svg=document.getElementById('rss');if(!svg)return;clr(svg);
  const v=S.rk.v;
  const hasRH=v==='reheat'||v==='rr';
  const hasReg=v==='regen'||v==='closed'||v==='rr';
  const CC='#C84B1A',COLD='#0369A1',JADE='#16A34A',GOLD='#1CBBBB';

  function box(x,y,w,h,col,label,sub){
    svgEl(svg,'rect',{x,y,width:w,height:h,rx:5,fill:'#fff',stroke:col,'stroke-width':2.2});
    svgEl(svg,'text',{x:x+w/2,y:sub?y+h/2-3:y+h/2+4,'text-anchor':'middle','font-size':10,fill:col,'font-weight':700},label);
    if(sub)svgEl(svg,'text',{x:x+w/2,y:y+h/2+10,'text-anchor':'middle','font-size':8,fill:col,opacity:.75},sub);
  }

  function orthoLine(pts,col,lbl){
    svgEl(svg,'polyline',{points:pts.map(p=>p[0]+','+p[1]).join(' '),fill:'none',stroke:col,'stroke-width':2.2,'stroke-linejoin':'round','stroke-linecap':'round'});
    const n=pts.length;
    const [x1,y1]=pts[n-2],[x2,y2]=pts[n-1];
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
    if(len<1)return;
    const ux=dx/len,uy=dy/len,nx=-uy*4,ny=ux*4;
    const ax=x2-8*ux,ay=y2-8*uy;
    svgEl(svg,'polygon',{points:`${ax+nx},${ay+ny} ${x2},${y2} ${ax-nx},${ay-ny}`,fill:col});
    if(lbl){
      const mx=pts.reduce((s,p)=>s+p[0],0)/n;
      const my=pts.reduce((s,p)=>s+p[1],0)/n;
      svgEl(svg,'rect',{x:mx-10,y:my-7,width:20,height:13,rx:3,fill:'#fff',opacity:.9});
      svgEl(svg,'text',{x:mx,y:my+4,'text-anchor':'middle','font-size':9,fill:col,'font-weight':700},lbl);
    }
  }
  // Horizontal turbine: narrow at inlet (left), wide at outlet (right) — expanding flow
  function turbTrap(x,y,w,h,col,label,sub){
    const o=h/6;
    svgEl(svg,'polygon',{points:`${x},${y+o} ${x+w},${y} ${x+w},${y+h} ${x},${y+h-o}`,fill:'#f0fdf4',stroke:col,'stroke-width':2.2});
    svgEl(svg,'text',{x:x+w/2,y:sub?y+h/2-3:y+h/2+4,'text-anchor':'middle','font-size':10,fill:col,'font-weight':700},label);
    if(sub)svgEl(svg,'text',{x:x+w/2,y:y+h/2+10,'text-anchor':'middle','font-size':8,fill:col,opacity:.75},sub);
  }
  // Vertical turbine: narrow at inlet (top), wide at outlet (bottom) — expanding flow
  function turbVertTrap(x,y,w,h,col,label,sub){
    const o=w/12;
    svgEl(svg,'polygon',{points:`${x+o},${y} ${x+w-o},${y} ${x+w},${y+h} ${x},${y+h}`,fill:'#f0fdf4',stroke:col,'stroke-width':2.2});
    svgEl(svg,'text',{x:x+w/2,y:sub?y+h/2-3:y+h/2+4,'text-anchor':'middle','font-size':10,fill:col,'font-weight':700},label);
    if(sub)svgEl(svg,'text',{x:x+w/2,y:y+h/2+10,'text-anchor':'middle','font-size':8,fill:col,opacity:.75},sub);
  }

  if(!hasRH){
    // ── SIMPLE / REGEN / SUPER: boiler top, turbine right, condenser bottom, pump left ──
    const bX=215,bY=15,bW=265,bH=50;
    const tX=558,tY=82,tW=90,tH=56;
    const cX=215,cY=172,cW=265,cH=48;
    const pX=58,pY=82,pW=90,pH=56;
    box(bX,bY,bW,bH,CC,'CALDERA','q_in');
    turbTrap(tX,tY,tW,tH,JADE,'TURBINA','w_t > 0');
    box(cX,cY,cW,cH,COLD,'CONDENSADOR','q_out');
    box(pX,pY,pW,pH,COLD,'BOMBA','w_p << 0');
    orthoLine([[bX+bW,bY+bH/2],[tX,bY+bH/2],[tX,tY+tH/2]],CC,'3');
    // state 4 exits turbine right face → down to condenser level → left
    orthoLine([[tX+tW,tY+tH/2],[tX+tW,cY+cH/2],[cX+cW,cY+cH/2]],COLD,'4');
    orthoLine([[cX,cY+cH/2],[pX+pW,cY+cH/2],[pX+pW,pY+pH/2]],COLD,'1');
    orthoLine([[pX+pW/2,pY],[pX+pW/2,bY+bH/2],[bX,bY+bH/2]],CC,'2');
    if(hasReg){
      const fX=60,fY=153,fW=88,fH=40;
      box(fX,fY,fW,fH,GOLD,v==='closed'?'FWH cerr.':'FWH abier.','sangrado');
      // bleed exits from inside turbine body (mid-expansion point)
      orthoLine([[tX+tW*0.6,tY+tH*0.6],[tX+tW*0.6,fY-8],[fX+fW/2,fY-8],[fX+fW/2,fY]],GOLD,'extr.');
    }
  } else {
    // ── REHEAT: horizontal line → CALDERA | TURB.AP | RECALENT. | TURB.BP ──
    const bX=12, bY=15,bW=170,bH=50;       // CALDERA
    const aX=196,aY=12, aW=80, aH=56;      // TURB. AP
    const hX=290,hY=15,hW=120,hH=50;       // RECALENTADOR
    const bpX=424,bpY=12,bpW=80,bpH=56;    // TURB. BP
    const cX=160,cY=170,cW=360,cH=48;      // CONDENSADOR
    const pX=18, pY=100,pW=80, pH=48;      // BOMBA
    // all top components align at y-mid = 40
    box(bX,bY,bW,bH,CC,'CALDERA','q_in');
    turbTrap(aX,aY,aW,aH,JADE,'TURB. AP','w_t1');
    box(hX,hY,hW,hH,CC,'RECALENTADOR','q_rh');
    turbTrap(bpX,bpY,bpW,bpH,JADE,'TURB. BP','w_t2');
    box(cX,cY,cW,cH,COLD,'CONDENSADOR','q_out');
    box(pX,pY,pW,pH,COLD,'BOMBA','w_p');
    orthoLine([[bX+bW,bY+bH/2],[aX,bY+bH/2]],CC,'3');
    orthoLine([[aX+aW,aY+aH/2],[hX,aY+aH/2]],CC,'4');
    orthoLine([[hX+hW,hY+hH/2],[bpX,hY+hH/2]],JADE,'5');
    orthoLine([[bpX+bpW,bpY+bpH/2],[bpX+bpW,cY]],COLD,'6');
    orthoLine([[cX,cY+cH/2],[pX+pW,cY+cH/2],[pX+pW,pY+pH/2]],COLD,'1');
    orthoLine([[pX+pW/2,pY],[pX+pW/2,bY+bH],[bX+bW/2,bY+bH]],CC,'2');
    if(hasReg){
      const fX=18,fY=155,fW=80,fH=38;
      box(fX,fY,fW,fH,GOLD,'FWH abier.','sangrado');
      // bleed from inside TURB.BP body → down above condenser → into FWH top
      orthoLine([[bpX+bpW*0.45,bpY+bpH/2],[bpX+bpW*0.45,fY-5],[fX+fW/2,fY-5],[fX+fW/2,fY]],GOLD,'extr.');
    }
  }
  document.getElementById('rs-sub').textContent=RV.find(r=>r.k===v)?.l||'';
}

/* ============================================================
   MACI COMPUTATION & RENDERING
   ============================================================ */
function calcMaci(){
const{v,r,rc,pa,ta}=S.ma;
const T1=ta+273.15,P1=pa*100; // kPa
let eta,wn,Pmax,Tmax,pmi;
// compressions
const T2=T1*Math.pow(r,G-1);
const P2=P1*Math.pow(r,G);
if(v==='otto'){
  // Q_in → T3-T2 isochoric
  const qin=800; // kJ/kg fixed
  const T3=T2+qin/CV;
  const T4=T3/Math.pow(r,G-1);
  eta=1-1/Math.pow(r,G-1);
  wn=qin*eta;
  Pmax=P2*T3/T2;Tmax=T3;pmi=wn*P1/(R_AIR*T1*1000);
}else if(v==='diesel'){
  const T3=T2*rc;
  const T4=T3*Math.pow(rc/r,G-1);
  eta=1-(1/Math.pow(r,G-1))*((Math.pow(rc,G)-1)/(G*(rc-1)));
  const qin=CP*(T3-T2);wn=qin*eta;
  Pmax=P2;Tmax=T3;pmi=wn*P1/(R_AIR*T1*1000);
}else{
  // dual: half V, half P
  const alpha=1.5; // P3/P2
  const T2a=T2*alpha;const T3=T2a*rc;
  const T4=T3*Math.pow(1/(r/rc),G-1);
  const qV=CV*(T2a-T2),qP=CP*(T3-T2a),qin=qV+qP;
  wn=qin-(CV*(T4-T1));eta=wn/qin;
  Pmax=P2*alpha;Tmax=T3;pmi=wn*P1/(R_AIR*T1*1000);
}
// knock risk for Otto
const knock=v==='otto'&&T2>700?'⚠ ALTO':v==='otto'&&T2>600?'MEDIO':'BAJO';
return{eta:Math.max(0,Math.min(.7,eta)),wn,Pmax:Pmax/100,Tmax,pmi:Math.abs(pmi),knock,T1,T2,P1:P1/100,P2:P2/100}
}

function drawMPV(d){
  const svg=document.getElementById('mpv');if(!svg)return;clr(svg);
  const W=360,H=280,ML=50,MR=14,MT=18,MB=36;
  svgEl(svg,'line',{x1:ML,y1:H-MB,x2:W-MR,y2:H-MB,stroke:'#9AA0AE'});
  svgEl(svg,'line',{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:'#9AA0AE'});
  svgEl(svg,'text',{x:W-MR,y:H-MB+16,'text-anchor':'end','font-size':10,fill:'#4A5168'},'v →');
  const v=S.ma.v,r=S.ma.r,rc=S.ma.rc;
  const v1=1,v2=1/r;
  const P1n=1,P2n=Math.pow(r,G);
  let states=[];
  let processLabels=[];
  if(v==='otto'){
    const T1b=S.ma.ta+273.15,T2b=T1b*Math.pow(r,G-1);
    const T3b=T2b+800/CV; // isochoric heat addition
    const P3n=P2n*T3b/T2b; // isochoric: P3/P2=T3/T2
    const P4n=P3n/Math.pow(r,G); // isentropic expansion back to v1
    states=[{v:v1,P:P1n,t:'adia'},{v:v2,P:P2n,t:'iv'},{v:v2,P:P3n,t:'adia'},{v:v1,P:P4n,t:'iv'}];
    processLabels=[['1→2','comp. adiabática'],['2→3','combustión v=cte'],['3→4','expansión adiab.'],['4→1','escape v=cte']];
  }else if(v==='diesel'){
    const v3=v2*rc;
    const P4n=P2n*Math.pow(v3/v1,G);
    states=[{v:v1,P:P1n,t:'adia'},{v:v2,P:P2n,t:'ip'},{v:v3,P:P2n,t:'adia'},{v:v1,P:Math.max(P1n,P4n),t:'iv'}];
    processLabels=[['1→2','comp. adiabática'],['2→3','combustión P=cte'],['3→4','expansión adiab.'],['4→1','escape v=cte']];
  }else{ // dual
    const alpha=1.5;const P3n=P2n*alpha;const v3=v2*rc;
    const P4n=P3n*Math.pow(v3/v1,G);
    states=[{v:v1,P:P1n,t:'adia'},{v:v2,P:P2n,t:'iv'},{v:v2,P:P3n,t:'ip'},{v:v3,P:P3n,t:'adia'},{v:v1,P:Math.max(P1n,P4n),t:'iv'}];
    processLabels=[['1→2','comp.'],['2→3a','comb. v=cte'],['3a→3b','comb. P=cte'],['3b→4','expansión'],['4→1','escape']];
  }
  const Pmin_v=Math.min(...states.map(s=>s.P)),Pmax_v=Math.max(...states.map(s=>s.P));
  const lpMin=Math.log(Pmin_v*0.7),lpMax=Math.log(Pmax_v*1.3);
  const allV=states.map(s=>s.v);
  const vmin=Math.min(...allV)*0.65,vmax=Math.max(...allV)*1.08;
  function px(vv){return ML+(vv-vmin)/(vmax-vmin)*(W-ML-MR)}
  function py(P){return H-MB-(Math.log(P)-lpMin)/(lpMax-lpMin)*(H-MT-MB)}
  // Log-P grid lines at decades
  const pGridVals=[Pmin_v,Math.sqrt(Pmin_v*Pmax_v),Pmax_v];
  pGridVals.forEach(P=>{
    svgEl(svg,'line',{x1:ML,y1:py(P),x2:W-MR,y2:py(P),stroke:'#EEF0F4','stroke-width':.5});
    svgEl(svg,'text',{x:ML-4,y:py(P)+3,'text-anchor':'end','font-size':8,fill:'#9AA0AE'},P.toFixed(0));
  });
  svgEl(svg,'text',{x:ML-8,y:MT+4,'font-size':10,fill:'#4A5168','text-anchor':'end'},'P [log]');
  // Process segments
  const segCols=['#1CBBBB','#C84B1A','#16A34A','#0369A1','#1CBBBB'];
  for(let i=0;i<states.length;i++){
    const a=states[i],b=states[(i+1)%states.length];
    const col=segCols[i]||'#1CBBBB';
    if(Math.abs(a.v-b.v)<.001){
      svgEl(svg,'line',{x1:px(a.v),y1:py(a.P),x2:px(b.v),y2:py(b.P),stroke:b.P>a.P?'#C84B1A':'#0369A1','stroke-width':2.5});
    }else if(Math.abs(a.P-b.P)<.01){
      svgEl(svg,'line',{x1:px(a.v),y1:py(a.P),x2:px(b.v),y2:py(b.P),stroke:'#C84B1A','stroke-width':2.5});
    }else{
      // Adiabatic
      const K=a.P*Math.pow(a.v,G);
      const pts=[];const N=20;
      for(let j=0;j<=N;j++){
        const vv=a.v+(b.v-a.v)*j/N;
        const P=K/Math.pow(vv,G);
        pts.push(`${px(vv)},${py(P)}`);
      }
      svgEl(svg,'polyline',{points:pts.join(' '),fill:'none',stroke:'#1CBBBB','stroke-width':2.5});
    }
  }
  // State dots and labels
  const labels=v==='dual'?['1','2','3a','3b','4']:['1','2','3','4'];
  states.forEach((s,i)=>{
    svgEl(svg,'circle',{cx:px(s.v),cy:py(s.P),r:5,fill:'#1CBBBB',stroke:'#fff','stroke-width':1.5});
    svgEl(svg,'text',{x:px(s.v)+8,y:py(s.P)-4,'font-size':11,fill:'#138F8F','font-weight':700},labels[i]||'');
  });
}

function drawMTS(d){
  const svg=document.getElementById('mts');if(!svg)return;clr(svg);
  const W=360,H=280,ML=50,MR=18,MT=18,MB=36;
  const v=S.ma.v,r=S.ma.r,rc=S.ma.rc;
  const T1=S.ma.ta+273.15,T2=T1*Math.pow(r,G-1);

  // States: proc = process FROM previous state TO this state
  let st=[];
  if(v==='otto'){
    const T3=T2+800/CV,s3=CV*Math.log(T3/T2),T4=T3/Math.pow(r,G-1);
    st=[{T:T1,s:0},{T:T2,s:0,proc:'isen'},{T:T3,s:s3,proc:'iso_v'},{T:T4,s:s3,proc:'isen'}];
  }else if(v==='diesel'){
    const T3=T2*rc,s3=CP*Math.log(T3/T2),T4=T3*Math.pow(rc/r,G-1);
    st=[{T:T1,s:0},{T:T2,s:0,proc:'isen'},{T:T3,s:s3,proc:'iso_p'},{T:T4,s:s3,proc:'isen'}];
  }else{
    const al=1.5,T2a=T2*al,s2a=CV*Math.log(T2a/T2);
    const T3=T2a*rc,s3=s2a+CP*Math.log(T3/T2a),T4=T3*Math.pow(rc/r,G-1);
    st=[{T:T1,s:0},{T:T2,s:0,proc:'isen'},{T:T2a,s:s2a,proc:'iso_v'},{T:T3,s:s3,proc:'iso_p'},{T:T4,s:s3,proc:'isen'}];
  }
  const last=st[st.length-1];

  // Exponential T-s curve: T = Ta*exp((s-sa)/c), c=Cv for isochoric, Cp for isobaric
  function curvePts(sa,Ta,sb,c,N=16){
    const pts=[];
    for(let j=0;j<=N;j++){const ss=sa+(sb-sa)*j/N;pts.push([ss,Ta*Math.exp((ss-sa)/c)]);}
    return pts;
  }

  // Bounds
  const sMax=Math.max(...st.map(s=>s.s))*1.2+0.03;
  const sMin=-0.04;
  const Tmin=Math.max(100,T1*0.8),Tmax=Math.max(...st.map(s=>s.T))*1.12;
  function px(s){return ML+(s-sMin)/(sMax-sMin)*(W-ML-MR)}
  function py(T){return H-MB-(T-Tmin)/(Tmax-Tmin)*(H-MT-MB)}

  // Build fill polygon: forward cycle + reverse closing
  const fp=[];
  // 1→2 isentrope (up-left side, at s=0)
  for(let j=0;j<=8;j++)fp.push([0,T1+(T2-T1)*j/8]);
  // Heat processes 2→...→4(before expansion)
  for(let i=2;i<st.length;i++){
    const a=st[i-1],b=st[i];
    if(b.proc!=='isen'){curvePts(a.s,a.T,b.s,b.proc==='iso_p'?CP:CV).forEach(p=>fp.push(p));}
    else{for(let j=0;j<=8;j++)fp.push([b.s,a.T+(b.T-a.T)*j/8]);}
  }
  // Closing 4→1 isochoric (from state 4 back to state 1, s decreasing)
  curvePts(last.s,last.T,0,CV).forEach(p=>fp.push(p));

  // Draw fill
  svgEl(svg,'polygon',{points:fp.map(p=>`${px(p[0])},${py(p[1])}`).join(' '),fill:'#1CBBBB',opacity:.12,stroke:'none'});

  // Axes + grid
  svgEl(svg,'line',{x1:ML,y1:H-MB,x2:W-MR,y2:H-MB,stroke:'#9AA0AE'});
  svgEl(svg,'line',{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:'#9AA0AE'});
  svgEl(svg,'text',{x:W-MR,y:H-MB+16,'text-anchor':'end','font-size':10,fill:'#4A5168'},'s →');
  svgEl(svg,'text',{x:ML-8,y:MT+4,'font-size':10,fill:'#4A5168','text-anchor':'end'},'T [K]');
  [500,1000,1500,2000,2500].forEach(T=>{if(T<Tmax&&T>Tmin){
    svgEl(svg,'line',{x1:ML,y1:py(T),x2:W-MR,y2:py(T),stroke:'#EEF0F4','stroke-width':.5});
    svgEl(svg,'text',{x:ML-4,y:py(T)+3,'text-anchor':'end','font-size':8,fill:'#9AA0AE'},T);
  }});

  // Draw segments
  for(let i=1;i<st.length;i++){
    const a=st[i-1],b=st[i];
    if(b.proc==='isen'){
      // Vertical isentrope
      svgEl(svg,'line',{x1:px(a.s),y1:py(a.T),x2:px(b.s),y2:py(b.T),stroke:'#1CBBBB','stroke-width':2.5});
    }else{
      // Exponential isochoric/isobaric heat addition
      const c=b.proc==='iso_p'?CP:CV;
      const pts=curvePts(a.s,a.T,b.s,c);
      svgEl(svg,'polyline',{points:pts.map(p=>`${px(p[0])},${py(p[1])}`).join(' '),fill:'none',stroke:'#C84B1A','stroke-width':2.5});
    }
  }
  // Closing: isochoric cooling 4→1
  const clPts=curvePts(last.s,last.T,0,CV);
  svgEl(svg,'polyline',{points:clPts.map(p=>`${px(p[0])},${py(p[1])}`).join(' '),fill:'none',stroke:'#0369A1','stroke-width':2.5});

  // q_in / q_out labels
  const smid=last.s*0.55;
  svgEl(svg,'text',{x:px(smid),y:py(Math.max(...st.map(s=>s.T))*0.92),'text-anchor':'middle','font-size':9,fill:'#C84B1A','font-weight':700},'↑ q_in');
  svgEl(svg,'text',{x:px(last.s*0.3),y:py((last.T+T1)/2+40),'text-anchor':'middle','font-size':9,fill:'#0369A1','font-weight':700},'q_out ↓');
  svgEl(svg,'text',{x:px(last.s*0.45),y:py(T2+(last.T-T2)*0.45),'text-anchor':'middle','font-size':8.5,fill:'#1CBBBB','font-weight':700},'w_neto');

  // State dots & labels
  const lbls=v==='dual'?['1','2','2a','3','4']:['1','2','3','4'];
  st.forEach((s,i)=>{
    svgEl(svg,'circle',{cx:px(s.s),cy:py(s.T),r:5,fill:'#1CBBBB',stroke:'#fff','stroke-width':1.5});
    const lx=i===st.length-1?px(s.s)+7:i===0?px(s.s)-8:px(s.s)+7;
    const anchor=i===0?'end':'start';
    svgEl(svg,'text',{x:lx,y:py(s.T)-4,'font-size':11,fill:'#138F8F','font-weight':700,'text-anchor':anchor},lbls[i]||'');
  });
}

function renderMaci(){
  const d=calcMaci();
  drawMPV(d);
  drawMTS(d);
  if(typeof drawMaciTurbo==='function')drawMaciTurbo();
  const fmt=(id,val,cls)=>{const el=document.getElementById(id);if(!el)return;el.textContent=val;if(cls!==undefined)el.className='mv'+(cls?' '+cls:'')};
  fmt('m-eta',(d.eta*100).toFixed(1)+' %','j');
  fmt('m-wn',d.wn.toFixed(0),'g');
  fmt('m-pm',d.Pmax.toFixed(0),'h');
  fmt('m-tm',d.Tmax.toFixed(0),'h');
  document.getElementById('m-eta-b').style.width=Math.min(100,d.eta*150)+'%';
  document.getElementById('m-wn-b').style.width=Math.min(100,d.wn/8)+'%';
  document.getElementById('m-pm-b').style.width=Math.min(100,d.Pmax)+'%';
  const knockEl=document.getElementById('m-kn');
  if(knockEl){
    knockEl.textContent=d.knock;
    knockEl.className='mv'+(d.knock.includes('ALTO')?' h':d.knock.includes('MEDIO')?' g':'');
  }
  // Sistemas activos panel
  let act='<p style="color:var(--dim)">Aspiración natural — sin sobrealimentación.</p>';
  if(S.ma.turbo||S.ma.super||S.ma.ic||S.ma.egr||S.ma.vtg){
    act='';
    if(S.ma.turbo)act+='<p style="margin:4px 0"><span style="color:var(--mu-d);font-weight:600">● Turbo</span> — P_adm='+S.ma.pa.toFixed(1)+' bar. Turbina de escape acoplada al compresor.</p>';
    if(S.ma.super)act+='<p style="margin:4px 0"><span style="color:#9333EA;font-weight:600">● Compresor mec.</span> — accionado por cigüeñal. Respuesta inmediata, roba potencia.</p>';
    if(S.ma.ic)act+='<p style="margin:4px 0"><span style="color:#0891B2;font-weight:600">● Intercooler</span> — enfría aire comprimido a T_adm='+S.ma.ta.toFixed(0)+'°C. ↑densidad ↑potencia ↓NOx/knock.</p>';
    if(S.ma.egr)act+='<p style="margin:4px 0"><span style="color:#16A34A;font-weight:600">● EGR</span> — recircula gases de escape. ↓T pico → ↓NOx. ↓potencia.</p>';
    if(S.ma.vtg)act+='<p style="margin:4px 0"><span style="color:var(--mu);font-weight:600">● VTG</span> — turbina con álabes de geometría variable. Optimiza el rango de revoluciones.</p>';
  }
  const actEl=document.getElementById('m-act');
  if(actEl)actEl.innerHTML=act;
}

function drawM4(stage){
  const svg=document.getElementById('m4-svg');if(!svg)return;clr(svg);
  const W=720,H=310;
  const stageCol=['#0369A1','#7C3AED','#C84B1A','#374151'];
  const gasColors=['#B8E6E6','#FFD89E','#FF6B35','#CBD5E1'];

  // ── Step progress pills at top ─────────────────────────
  ['Admisión','Compresión','Expansión','Escape'].forEach((lbl,i)=>{
    const bx=5+i*77,active=i===stage;
    svgEl(svg,'rect',{x:bx,y:3,width:73,height:20,rx:10,
      fill:active?stageCol[i]:'#F3F4F6',stroke:active?stageCol[i]:'#E0E0E0','stroke-width':1.2});
    svgEl(svg,'text',{x:bx+36.5,y:17,'text-anchor':'middle','font-size':8.5,
      fill:active?'#fff':'#9CA3AF','font-weight':active?700:400},`${i+1}·${lbl}`);
  });

  // ── Cylinder & piston ──────────────────────────────────
  const cx=150,cyTop=32,bore=100,strokeMax=122,pistonH=25;
  const pos=[0.85,0.05,0.85,0.05][stage];
  const pistonY=cyTop+8+pos*strokeMax;

  // Cylinder body
  svgEl(svg,'rect',{x:cx-bore/2-5,y:cyTop,width:bore+10,height:strokeMax+26,rx:6,fill:'#F4F5F7',stroke:'#4A5168','stroke-width':2.5});
  // Gas region
  svgEl(svg,'rect',{x:cx-bore/2,y:cyTop+7,width:bore,height:Math.max(4,pistonY-cyTop-7),fill:gasColors[stage],opacity:.9});
  if(stage===2)svgEl(svg,'text',{x:cx,y:cyTop+22,'text-anchor':'middle','font-size':20},'⚡');
  // Piston
  svgEl(svg,'rect',{x:cx-bore/2,y:pistonY,width:bore,height:pistonH,fill:'#6B7280',stroke:'#374151','stroke-width':1.5});
  svgEl(svg,'line',{x1:cx-bore/2,y1:pistonY+8,x2:cx+bore/2,y2:pistonY+8,stroke:'#4B5563','stroke-width':1.2});
  svgEl(svg,'line',{x1:cx-bore/2,y1:pistonY+15,x2:cx+bore/2,y2:pistonY+15,stroke:'#4B5563','stroke-width':1.2});

  // Crank mechanism
  const crankCy=cyTop+strokeMax+65,crankR=22;
  const crankAngles=[Math.PI/2,-Math.PI/2,Math.PI/2,-Math.PI/2];
  const ang=crankAngles[stage];
  const pinX=cx+crankR*Math.cos(ang),pinY=crankCy+crankR*Math.sin(ang);
  svgEl(svg,'line',{x1:cx,y1:pistonY+pistonH*0.5,x2:pinX,y2:pinY,stroke:'#374151','stroke-width':4,'stroke-linecap':'round'});
  svgEl(svg,'circle',{cx,cy:crankCy,r:crankR,fill:'#F4F5F7',stroke:'#374151','stroke-width':2});
  svgEl(svg,'line',{x1:cx,y1:crankCy,x2:pinX,y2:pinY,stroke:'#374151','stroke-width':3,'stroke-linecap':'round'});
  svgEl(svg,'circle',{cx:pinX,cy:pinY,r:5,fill:'#374151'});
  svgEl(svg,'circle',{cx,cy:crankCy,r:5,fill:'#374151'});

  // Valves
  const ivOpen=[true,false,false,false][stage],evOpen=[false,false,false,true][stage];
  const vOff=ivOpen?19:13;
  svgEl(svg,'line',{x1:cx-bore/2+16,y1:cyTop+7,x2:cx-bore/2+16,y2:cyTop+vOff,stroke:'#0369A1','stroke-width':3});
  svgEl(svg,'polygon',{points:`${cx-bore/2+8},${cyTop+vOff} ${cx-bore/2+24},${cyTop+vOff} ${cx-bore/2+16},${cyTop+vOff+7}`,fill:ivOpen?'#0369A1':'#9CA3AF'});
  svgEl(svg,'text',{x:cx-bore/2+16,y:cyTop-3,'text-anchor':'middle','font-size':8.5,fill:'#0369A1','font-weight':700},'IN');
  const eOff=evOpen?19:13;
  svgEl(svg,'line',{x1:cx+bore/2-16,y1:cyTop+7,x2:cx+bore/2-16,y2:cyTop+eOff,stroke:'#C84B1A','stroke-width':3});
  svgEl(svg,'polygon',{points:`${cx+bore/2-24},${cyTop+eOff} ${cx+bore/2-8},${cyTop+eOff} ${cx+bore/2-16},${cyTop+eOff+7}`,fill:evOpen?'#C84B1A':'#9CA3AF'});
  svgEl(svg,'text',{x:cx+bore/2-16,y:cyTop-3,'text-anchor':'middle','font-size':8.5,fill:'#C84B1A','font-weight':700},'EX');
  svgEl(svg,'text',{x:cx+bore/2+8,y:cyTop+10,'font-size':8,fill:'#9CA3AF'},'PMS');
  svgEl(svg,'text',{x:cx+bore/2+8,y:cyTop+strokeMax+8,'font-size':8,fill:'#9CA3AF'},'PMI');

  // ── Right: P-v mini diagram (log P scale, actual thermodynamics) ──
  const pX0=328,pY0=28,pW=370,pH=200;
  svgEl(svg,'line',{x1:pX0,y1:pY0+pH,x2:pX0+pW,y2:pY0+pH,stroke:'#9AA0AE'});
  svgEl(svg,'line',{x1:pX0,y1:pY0,x2:pX0,y2:pY0+pH,stroke:'#9AA0AE'});
  svgEl(svg,'text',{x:pX0+pW,y:pY0+pH+13,'text-anchor':'end','font-size':9.5,fill:'#4A5168'},'v →');
  svgEl(svg,'text',{x:pX0-4,y:pY0+8,'font-size':9.5,fill:'#4A5168','text-anchor':'end'},'P');

  // Compute actual states
  const r=S.ma.r,rc=S.ma.rc;
  const T1b=S.ma.ta+273.15,P1b=S.ma.pa;
  const T2b=T1b*Math.pow(r,G-1),P2b=P1b*Math.pow(r,G);
  const v1b=1,v2b=1/r;
  let st4=[],sg4=[];
  if(S.ma.v==='otto'){
    const T3b=T2b+800/CV,P3b=P2b*T3b/T2b,P4b=P1b*T3b/T2b/Math.pow(r,G-1)*T1b/T3b*T3b/T1b;
    const realP4=P3b/Math.pow(r,G);
    st4=[{v:v1b,P:P1b,l:'1'},{v:v2b,P:P2b,l:'2'},{v:v2b,P:P3b,l:'3'},{v:v1b,P:realP4,l:'4'}];
    sg4=[{a:0,b:1,t:'s'},{a:1,b:2,t:'v'},{a:2,b:3,t:'s'},{a:3,b:0,t:'v'}];
  }else if(S.ma.v==='diesel'){
    const v3b=v2b*rc,T3b=T2b*rc,P3b=P2b;
    const P4b=P3b*Math.pow(v3b/v1b,G);
    st4=[{v:v1b,P:P1b,l:'1'},{v:v2b,P:P2b,l:'2'},{v:v3b,P:P3b,l:'3'},{v:v1b,P:Math.max(P1b,P4b),l:'4'}];
    sg4=[{a:0,b:1,t:'s'},{a:1,b:2,t:'p'},{a:2,b:3,t:'s'},{a:3,b:0,t:'v'}];
  }else{
    const al=1.5,P3ab=P2b*al,T2ab=T2b*al,v3b=v2b*rc,P3b=P3ab,T3b=T2ab*rc;
    const P4b=P3b*Math.pow(v3b/v1b,G);
    st4=[{v:v1b,P:P1b,l:'1'},{v:v2b,P:P2b,l:'2'},{v:v2b,P:P3ab,l:'3a'},{v:v3b,P:P3b,l:'3b'},{v:v1b,P:Math.max(P1b,P4b),l:'4'}];
    sg4=[{a:0,b:1,t:'s'},{a:1,b:2,t:'v'},{a:2,b:3,t:'p'},{a:3,b:4,t:'s'},{a:4,b:0,t:'v'}];
  }
  // Log-P scale
  const Pmin_v=Math.min(...st4.map(s=>s.P)),Pmax_v=Math.max(...st4.map(s=>s.P));
  const vMin_v=Math.min(...st4.map(s=>s.v)),vMax_v=Math.max(...st4.map(s=>s.v));
  const lpMin=Math.log(Pmin_v*0.75),lpMax=Math.log(Pmax_v*1.25);
  const vd_min=vMin_v*0.65,vd_max=vMax_v*1.08;
  function pvx4(v){return pX0+(v-vd_min)/(vd_max-vd_min)*pW}
  function pvy4(P){return pY0+pH-(Math.log(P)-lpMin)/(lpMax-lpMin)*pH}

  // Active segments per animation stage
  const actSegs={0:[],1:[0],2:[1,2],3:[sg4.length-1]}[stage]||[];

  // Draw all segments dimmed, then highlight
  sg4.forEach((sg,si)=>{
    const a=st4[sg.a],b=st4[sg.b];
    const isAct=actSegs.includes(si);
    const col=isAct?['#1CBBBB','#C84B1A','#16A34A','#0369A1','#1CBBBB'][si]:'#D1D5DB';
    const sw=isAct?3:1.8;
    if(sg.t==='s'){
      const K=a.P*Math.pow(a.v,G);
      const pts=[];
      for(let j=0;j<=20;j++){const vv=a.v+(b.v-a.v)*j/20;pts.push(`${pvx4(vv)},${pvy4(K/Math.pow(vv,G))}`);}
      svgEl(svg,'polyline',{points:pts.join(' '),fill:'none',stroke:col,'stroke-width':sw});
    }else{
      svgEl(svg,'line',{x1:pvx4(a.v),y1:pvy4(a.P),x2:pvx4(b.v),y2:pvy4(b.P),stroke:col,'stroke-width':sw});
    }
  });
  // Active state dots
  const actStates=new Set(actSegs.flatMap(si=>[sg4[si].a,sg4[si].b]));
  if(stage===0)actStates.add(0);
  st4.forEach((s,i)=>{
    const act=actStates.has(i);
    svgEl(svg,'circle',{cx:pvx4(s.v),cy:pvy4(s.P),r:act?5.5:3.5,fill:act?stageCol[stage]:'#9CA3AF',stroke:'#fff','stroke-width':1.5});
    svgEl(svg,'text',{x:pvx4(s.v)+7,y:pvy4(s.P)-4,'font-size':10,fill:'#138F8F','font-weight':700},s.l);
  });
  const cname={otto:'Otto',diesel:'Diesel',dual:'Dual'}[S.ma.v]||'';
  svgEl(svg,'text',{x:pX0+pW/2,y:pY0+pH+24,'text-anchor':'middle','font-size':10.5,fill:'#4A5168','font-style':'italic'},`Ciclo ${cname} · P–v`);

  // ── Bottom description strip ───────────────────────────
  svgEl(svg,'rect',{x:0,y:281,width:W,height:29,fill:'#F8FAFC',rx:0});
  svgEl(svg,'line',{x1:0,y1:281,x2:W,y2:281,stroke:'#E2E8F0','stroke-width':1});
  svgEl(svg,'circle',{cx:16,cy:295,r:8,fill:stageCol[stage]});
  svgEl(svg,'text',{x:16,y:299,'text-anchor':'middle','font-size':9,fill:'#fff','font-weight':700},stage+1);
  svgEl(svg,'text',{x:30,y:299,'font-size':9.5,fill:'#374151'},M4_DESC[stage]||'');
}

function wireM4(){
  document.querySelectorAll('#m4-svg').forEach(()=>{});
  document.querySelectorAll('button[data-st]').forEach(b=>{
    b.addEventListener('click',function(){
      const st=+this.dataset.st;
      if(st===-1){
        // Animate cycle
        if(m4_anim){clearInterval(m4_anim);m4_anim=null;this.textContent='▶ Animar';return}
        let s=0;
        m4_anim=setInterval(()=>{s=(s+1)%4;m4_stage=s;drawM4(s);
          document.querySelectorAll('button[data-st]').forEach(x=>x.classList.toggle('on',+x.dataset.st===s));
        },1200);
        this.textContent='⏸ Pausa';
        return;
      }
      if(m4_anim){clearInterval(m4_anim);m4_anim=null;document.querySelectorAll('button[data-st="-1"]').forEach(x=>x.textContent='▶ Animar')}
      m4_stage=st;
      document.querySelectorAll('button[data-st]').forEach(x=>x.classList.toggle('on',+x.dataset.st===st));
      drawM4(st);
    });
  });
  drawM4(0);
}

document.addEventListener('DOMContentLoaded',()=>{
  buildAll();
  setTimeout(()=>mjSet(),1200);
});
</script>
