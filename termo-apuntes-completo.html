<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="upernas">
<title>Ingeniería Térmica y Fluidos · Apuntes interactivos: Fundamentos y Ciclos de gas, vapor y MACI</title>
<script>MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]},startup:{typeset:false}};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--mu:#1CBBBB;--mu-d:#138F8F;--mu-dk:#1B3D50;--mu-light:#E0F6F6;--ink:#FFFFFF;--paper:#FFFFFF;--paper2:#F4F5F7;--paper3:#EEF0F4;--line:#D8DCE6;--lsoft:#E8EAF0;--text:#1A1F2E;--dim:#4A5168;--mute:#9AA0AE;--hot:#C84B1A;--cold:#0369A1;--jade:#16A34A;--viol:#6D28D9;--gold:#E9A820;--sans:'Manrope',system-ui,sans-serif;--serif:'Fraunces',Georgia,serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(135deg,#E0F6F6 0%,#fff 35%,#F4F5F7 100%);z-index:-2}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(28,187,187,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(28,187,187,.04) 1px,transparent 1px);background-size:40px 40px;z-index:-1;pointer-events:none}

/* ---- HEADER ---- */
header{border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);position:sticky;top:0;z-index:150}
.hi{max-width:1440px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.02em;cursor:pointer;user-select:none}
.brand span{color:var(--mu);font-style:italic}
.brand small{display:block;font-family:var(--sans);font-size:9.5px;font-weight:500;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
/* Hamburger */
.ham{background:none;border:1px solid var(--line);cursor:pointer;padding:9px 10px;display:flex;flex-direction:column;gap:5px;border-radius:7px;transition:.2s;flex-shrink:0}
.ham:hover{background:var(--mu-light);border-color:var(--mu)}
.ham span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:.28s ease}
.ham.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.ham.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.ham.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
/* Active section chip in header */
.hi-sec{font-family:var(--mono);font-size:11px;color:var(--mu-d);background:var(--mu-light);border:1px solid var(--mu);padding:3px 9px;border-radius:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
/* Overlay */
.sb-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.sb-overlay.on{opacity:1;pointer-events:all}
/* Sidebar */
.sidebar{position:fixed;top:0;left:0;width:272px;height:100dvh;background:#fff;z-index:201;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden;box-shadow:6px 0 32px rgba(0,0,0,.14)}
.sidebar.on{transform:translateX(0)}
.sb-head{padding:16px 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.sb-logo{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.25;color:var(--text)}
.sb-logo span{color:var(--mu);font-style:italic}
.sb-close{background:none;border:1px solid var(--line);cursor:pointer;color:var(--mute);font-size:16px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:.15s;flex-shrink:0;line-height:1}
.sb-close:hover{color:var(--text);background:var(--paper2);border-color:var(--text)}
.sb-body{flex:1;overflow-y:auto;padding:8px 8px 20px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sb-grp-lbl{font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--mu);padding:7px 12px;margin:10px 0 4px;border-radius:7px;display:flex;align-items:center;gap:6px}
.sb-grp-lbl .sb-grp-n{font-family:var(--mono);font-size:10px;opacity:.75;font-weight:400}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:var(--sans);font-size:13px;color:var(--dim);transition:.15s;position:relative}
.sb-item:hover{background:var(--paper2);color:var(--text)}
.sb-item.active{background:var(--mu-light);color:var(--mu-d);font-weight:600}
.sb-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--mu);border-radius:0 2px 2px 0}
.sb-item.sb-home{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.sb-item.sb-home:hover{background:var(--mu-light);color:var(--mu-d)}
.sb-item.sb-home.active{background:var(--mu);color:#fff}
.sb-item.sb-home.active::before{display:none}
.sb-num{font-family:var(--mono);font-size:11px;color:var(--mute);width:26px;flex-shrink:0;text-align:right}
.sb-item.active .sb-num{color:var(--mu)}
nav.main{display:none}
/* prev/next strip */
.sec-nav{display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:18px;border-top:1px solid var(--line)}
.sec-nav button{background:var(--paper2);border:1px solid var(--line);color:var(--dim);padding:8px 16px;border-radius:7px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s}
.sec-nav button:hover{background:var(--mu);color:#fff;border-color:var(--mu)}
.sec-nav .sec-nav-title{font-size:11px;color:var(--mute);font-family:var(--sans)}
/* home cards improved */
.ic{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:16px;cursor:pointer;transition:.2s}
.ic:hover{border-color:var(--mu);box-shadow:0 4px 14px rgba(28,187,187,.12);transform:translateY(-1px)}
.ic .n{font-family:var(--serif);font-size:22px;color:var(--mu);font-weight:700;margin-bottom:4px}
.ic h4{font-family:var(--serif);font-size:15px;margin-bottom:8px;color:var(--text)}
.ic ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px}
.ic ul li{font-size:11px;color:var(--dim);display:flex;align-items:flex-start;gap:5px;line-height:1.4}
.ic ul li::before{content:'·';color:var(--mu);font-weight:700;flex-shrink:0}

/* ---- LAYOUT ---- */
main{max-width:1440px;margin:0 auto;padding:24px 28px}
.sec{display:none;animation:fi .3s ease}.sec.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.sh{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sh h1{font-family:var(--serif);font-weight:500;font-size:34px;letter-spacing:-.03em;line-height:1;margin-bottom:5px}
.sh h1 em{color:var(--mu);font-style:italic;font-weight:400}
.sh .lead{color:var(--dim);font-size:13.5px;max-width:780px}
.sh .badge{display:inline-block;background:var(--mu-light);border:1px solid var(--mu);color:var(--mu-d);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}

/* ---- CARDS GRID ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:18px}
.card.mu{border-left:4px solid var(--mu)}
.card.hot{border-left:4px solid var(--hot)}
.card.cold{border-left:4px solid var(--cold)}
.card.jade{border-left:4px solid var(--jade)}
.card.viol{border-left:4px solid var(--viol)}
.card h3{font-family:var(--serif);font-size:16px;margin-bottom:8px}
.card h4{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.card p,.card li{color:var(--dim);font-size:13px;line-height:1.5}
.card ul{list-style:none;margin-top:6px}
.card ul li{padding:3px 0 3px 16px;position:relative}
.card ul li::before{content:'→';position:absolute;left:0;color:var(--mu)}

/* ---- SLIDERS ---- */
.ctrl{margin-bottom:12px}
.ctrl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.ctrl-row .nm{font-size:12px;color:var(--dim);font-weight:500}
.ctrl-row .vl{font-family:var(--mono);font-size:12px;color:var(--mu-d);font-weight:700;background:var(--mu-light);padding:2px 7px;border-radius:4px}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;background:var(--paper3);border-radius:2px;outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;background:var(--mu);border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--mu)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;background:var(--mu);border-radius:50%;cursor:pointer;border:2px solid #fff}

/* ---- DIAGRAMS ---- */
.diagram{background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0}
.diagram svg{width:100%;height:auto;display:block}
.diagram-title{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}

/* ---- FORMULAS ---- */
.fblock{background:#FAFBFE;border:1px solid var(--line);border-left:3px solid var(--mu);border-radius:6px;padding:14px 18px;margin:10px 0;font-size:14px;overflow-x:auto}
.fblock.hot{border-left-color:var(--hot)}
.fblock.jade{border-left-color:var(--jade)}
.fblock.cold{border-left-color:var(--cold)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.frow{display:flex;align-items:baseline;gap:12px;padding:4px 0;border-bottom:1px solid var(--lsoft)}
.frow:last-child{border:none}
.fsym{font-size:13.5px;min-width:220px;flex-shrink:0;color:var(--text)}
.fdesc{font-size:12px;color:var(--dim);font-style:italic}

/* ---- THEORY SECTIONS ---- */
.th{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--mu);border-radius:10px;padding:22px;margin-top:28px}
.th h3{font-family:var(--serif);font-size:19px;margin-bottom:10px}
.th h4{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:16px 0 7px}
.th p{color:var(--dim);font-size:13px;max-width:80ch;margin-bottom:9px}
.th p strong{color:var(--text);font-weight:600}
.th ul{list-style:none;margin-bottom:10px}
.th ul li{color:var(--dim);font-size:13px;padding:3px 0 3px 16px;position:relative;max-width:80ch}
.th ul li::before{content:'→';position:absolute;left:0;color:var(--mu)}

/* ---- CALLOUTS ---- */
.co{padding:12px 16px;border-radius:6px;margin:12px 0;font-size:12.5px;color:var(--dim)}
.co.mu{background:var(--mu-light);border-left:3px solid var(--mu)}
.co.hot{background:rgba(200,75,26,.07);border-left:3px solid var(--hot)}
.co.jade{background:rgba(22,163,74,.07);border-left:3px solid var(--jade)}
.co strong{color:var(--text);display:block;margin-bottom:3px;font-weight:600}

/* ---- DEVICE TABS ---- */
.dtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.dtab{background:var(--paper2);border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:5px;font-size:11.5px;font-weight:600;cursor:pointer;transition:.2s}
.dtab:hover{background:var(--mu-light);color:var(--mu-d)}
.dtab.on{background:var(--mu);color:#fff;border-color:var(--mu)}

/* ---- METRICS STRIP ---- */
.mstrip{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.mchip{background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;text-align:center;min-width:90px}
.mchip .mval{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--mu)}
.mchip .mval.hot{color:var(--hot)}
.mchip .mval.jade{color:var(--jade)}
.mchip .mval.cold{color:var(--cold)}
.mchip .mlbl{font-size:10px;color:var(--mute);margin-top:2px}

/* ---- TOGGLE SWITCH ---- */
.tsw{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px;color:var(--dim)}
.tsw input[type=checkbox]{width:36px;height:20px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:10px;cursor:pointer;position:relative;transition:.2s}
.tsw input[type=checkbox]:checked{background:var(--mu)}
.tsw input[type=checkbox]::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tsw input[type=checkbox]:checked::after{left:19px}

/* ---- PROCESS BTNS ---- */
.pbtn{display:inline-block;padding:6px 12px;background:var(--paper2);border:1px solid var(--line);border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;margin:3px;transition:.2s}
.pbtn:hover{border-color:var(--mu);color:var(--mu)}
.pbtn.on{background:var(--mu);color:#fff;border-color:var(--mu)}

/* ---- TABLE ---- */
table.t{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
table.t th{background:var(--paper3);color:var(--mu-d);padding:7px 10px;text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase}
table.t td{padding:7px 10px;border-bottom:1px solid var(--lsoft);color:var(--dim)}
table.t td:first-child{color:var(--text);font-weight:500}

/* ---- WORKSPACE ---- */
.ws{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
@media(max-width:800px){.ws{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:16px}
.pt{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--lsoft);display:flex;align-items:center;gap:6px}
.pt::before{content:'';width:5px;height:5px;background:var(--mu);border-radius:50%;flex-shrink:0}

/* ---- SANKEY / FLOW ---- */
.flow-box{display:flex;align-items:center;gap:0;margin:16px 0}
.flow-node{background:var(--mu-light);border:2px solid var(--mu);border-radius:8px;padding:10px 14px;text-align:center;font-size:12px;font-weight:600;color:var(--mu-d);min-width:80px}
.flow-node.hot{background:rgba(200,75,26,.1);border-color:var(--hot);color:var(--hot)}
.flow-node.cold{background:rgba(3,105,161,.1);border-color:var(--cold);color:var(--cold)}
.flow-node.work{background:rgba(233,168,32,.1);border-color:var(--gold);color:#b07a00}
.flow-arrow{flex:1;height:3px;background:linear-gradient(90deg,var(--mu),var(--mu-d));position:relative;display:flex;align-items:center;justify-content:center}
.flow-arrow::after{content:'';position:absolute;right:0;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:10px solid var(--mu-d)}
.flow-arrow span{background:var(--paper);padding:0 4px;font-size:10px;font-family:var(--mono);color:var(--mu-d)}

/* ---- IDEAL GAS CALC ---- */
.ig-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.ig-prop{display:flex;flex-direction:column;gap:3px}
.ig-prop label{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
.ig-input{width:100%;padding:7px 8px;border:1.5px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:13px;color:var(--text);background:var(--paper);outline:none;transition:.15s}
.ig-input:focus{border-color:var(--mu)}
.ig-input.ig-computed{background:var(--mu-light);border-color:var(--mu);color:var(--mu-d);font-weight:600}
.ig-clr{margin-top:2px;padding:3px 0;border:none;background:none;color:var(--mute);font-size:11px;cursor:pointer;text-align:center;border-radius:4px;transition:.15s}
.ig-clr:hover{color:var(--hot);background:var(--paper2)}
.ig-result{margin-top:8px;border-radius:7px;padding:8px 12px;font-size:12px;line-height:1.5}
.ig-hint{color:var(--dim)}
.ig-warn{background:#FFFBEB;border:1px solid #FCD34D;color:#92400E;border-radius:6px;padding:7px 10px}
.ig-ok{background:#F0FDF4;border:1px solid #86EFAC;color:#166534;border-radius:6px;padding:7px 10px}
.ig-err{background:#FEF2F2;border:1px solid #FCA5A5;color:#991B1B;border-radius:6px;padding:7px 10px}
.ig-formula{margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--dim);background:var(--paper2);border-radius:4px;padding:4px 8px}
.ig-gas-row{margin-bottom:10px}
.ig-gas-row select{width:100%;padding:6px 8px;border:1.5px solid var(--line);border-radius:6px;font-family:var(--sans);font-size:12px;background:var(--paper);color:var(--text)}
footer{margin-top:50px;padding:24px 28px;text-align:center;color:var(--mute);font-size:11px;border-top:1px solid var(--line)}
footer em{color:var(--mu);font-family:var(--serif);font-style:italic}

/* ===== CYCLES LAYOUT (from CP2 Ciclos) ===== */
.ws{display:grid;grid-template-columns:270px 1fr 300px;gap:20px;align-items:start}
@media(max-width:1200px){.ws{grid-template-columns:260px 1fr}.mc{grid-column:1/-1}}
@media(max-width:800px){.ws{grid-template-columns:1fr}}
.pnl{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:18px}
.cg{margin-bottom:15px}.cg:last-child{margin-bottom:0}
.cl{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cl .nm{font-size:12.5px;color:var(--dim);font-weight:500}
.cl .vl{font-family:var(--mono);font-size:12.5px;color:var(--mu-d);font-weight:600;background:var(--mu-light);padding:2px 7px;border-radius:4px;min-width:55px;text-align:right}
.vs{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.vs button{background:0;border:1px solid var(--line);color:var(--dim);padding:8px 10px;border-radius:5px;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;text-align:left;transition:.2s}
.vs button:hover{background:var(--paper2);color:var(--text)}
.vs button.on{background:var(--mu-light);border-color:var(--mu);color:var(--mu-d);border-left:3px solid var(--mu)}
.dc{display:flex;flex-direction:column;gap:20px}
.dr{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.dr{grid-template-columns:1fr}}
.dcd{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:14px;min-height:290px;display:flex;flex-direction:column}
.dcd.w{grid-column:1/-1}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--lsoft)}
.dt{font-family:var(--serif);font-weight:600;font-size:15px}
.ds{font-family:var(--mono);font-size:10px;color:var(--mute)}
.db{flex:1;display:flex;align-items:center;justify-content:center}
.db svg{width:100%;height:auto;display:block}
.mc{display:flex;flex-direction:column;gap:20px}
.mt{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--lsoft)}
.mt:last-child{border-bottom:0}
.mn{font-size:12.5px;color:var(--dim)}.mn small{display:block;color:var(--mute);font-size:10px;margin-top:1px}
.mv{font-family:var(--mono);font-size:14px;color:var(--text);font-weight:600}
.mv.h{color:var(--hot)}.mv.c{color:var(--cold)}.mv.g{color:var(--mu)}.mv.j{color:var(--jade)}
.bar{margin-top:3px;height:4px;background:var(--paper2);border-radius:2px;overflow:hidden;position:relative}
.bf{position:absolute;top:0;bottom:0;transition:width .4s ease}
.bf.j{background:var(--jade)}.bf.g{background:var(--mu)}.bf.h{background:var(--hot)}
.fm{font-family:'STIX Two Text',var(--serif);font-size:14px;background:#FAFBFE;padding:14px 20px;border-radius:6px;margin:10px 0;border:1px solid var(--line);border-left:3px solid var(--mu);color:var(--text);overflow-x:auto;letter-spacing:.01em;line-height:1.7}

const WATER_SAT=[

function waterSatAt(T_C){
  // Linear interpolation in T
  if(T_C<=WATER_SAT[0][0])return WATER_SAT[0];
  if(T_C>=WATER_SAT[WATER_SAT.length-1][0])return WATER_SAT[WATER_SAT.length-1];
  for(let i=0;i<WATER_SAT.length-1;i++){
    if(T_C>=WATER_SAT[i][0]&&T_C<=WATER_SAT[i+1][0]){
      const a=WATER_SAT[i],b=WATER_SAT[i+1];
      const f=(T_C-a[0])/(b[0]-a[0]);
      return a.map((v,j)=>v+f*(b[j]-v));
    }
  }
  return WATER_SAT[WATER_SAT.length-1];
}
function waterSatAtP(P_kPa){
  // Interpolate T from P
  if(P_kPa<=WATER_SAT[0][1])return WATER_SAT[0];
  if(P_kPa>=WATER_SAT[WATER_SAT.length-1][1])return WATER_SAT[WATER_SAT.length-1];
  for(let i=0;i<WATER_SAT.length-1;i++){
    if(P_kPa>=WATER_SAT[i][1]&&P_kPa<=WATER_SAT[i+1][1]){
      const a=WATER_SAT[i],b=WATER_SAT[i+1];
      const f=(P_kPa-a[1])/(b[1]-a[1]);
      return a.map((v,j)=>v+f*(b[j]-v));
    }
  }
  return WATER_SAT[WATER_SAT.length-1];
}

<div class="th">
<h3>Magnitudes extensivas e intensivas</h3>
<p><strong>Extensivas</strong>: dependen del tamaño del sistema, son aditivas (V, m, E, H, S, U...).</p>
<p><strong>Intensivas</strong>: no dependen del tamaño (T, P, ρ, v, u, h, s...).</p>
<p>Cualquier magnitud extensiva se convierte en intensiva dividiéndola por la masa (→ magnitud específica) o por el volumen.</p>
<table class="t">
<thead><tr><th>Extensiva</th><th>Intensiva específica</th><th>Unidades SI</th><th>Concepto</th></tr></thead>
<tbody>
<tr><td>V [m³]</td><td>v = V/m [m³/kg]</td><td>m³/kg</td><td>Volumen específico</td></tr>
<tr><td>m [kg]</td><td>ρ = m/V [kg/m³]</td><td>kg/m³</td><td>Densidad</td></tr>
<tr><td>U [J]</td><td>u = U/m [J/kg]</td><td>kJ/kg</td><td>Energía interna espec.</td></tr>
<tr><td>H [J]</td><td>h = H/m [J/kg]</td><td>kJ/kg</td><td>Entalpía específica</td></tr>
<tr><td>S [J/K]</td><td>s = S/m [J/kg·K]</td><td>kJ/kg·K</td><td>Entropía específica</td></tr>
</tbody>
</table>
</div>

<div class="grid2" style="margin-top:18px">
<div>
<div class="th">
<h3>Ley 0ª de la Termodinámica</h3>
<p>Si dos sistemas A y B están en equilibrio térmico con un tercero C, entonces A y B están en equilibrio térmico entre sí.</p>
<div class="fblock">$$T_A = T_C \\;\\text{ y }\\; T_B = T_C \\;\\Rightarrow\\; T_A = T_B$$</div>
<p>Fundamento de la <strong>termometría</strong>: permite medir temperatura comparando con un patrón.</p>
<h4>Escalas de temperatura</h4>
<div class="fblock">$$T[\\text{K}] = T[°C] + 273.15$$
$$T[°R] = 1.8 \\cdot T[K]$$
$$T[°F] = T[°R] - 459.67$$</div>
</div>

<div class="diagram" style="margin-top:14px">
<div class="diagram-title">Conversor de escalas</div>
<div class="ctrl"><div class="ctrl-row"><span class="nm">T [°C]</span><span class="vl" id="tc-v">100</span></div><input type="range" id="tc-sl" min="-50" max="600" value="100"></div>
<div class="mstrip">
  <div class="mchip"><div class="mval" id="conv-k">373.15</div><div class="mlbl">Kelvin [K]</div></div>
  <div class="mchip"><div class="mval cold" id="conv-r">671.67</div><div class="mlbl">Rankine [°R]</div></div>
  <div class="mchip"><div class="mval hot" id="conv-f">212</div><div class="mlbl">Fahrenheit [°F]</div></div>
</div>
</div>
</div>

<div>
<div class="th">
<h3>Procesos termodinámicos</h3>
<p>El <strong>estado</strong> de un sistema se describe por propiedades (P, T, v, ...).</p>
<p>Un <strong>proceso cuasiestático</strong> es aquel que pasa por estados de equilibrio infinitesimalmente separados → permite trazar curvas en los diagramas P-v y T-s.</p>
<p>Un <strong>ciclo termodinámico</strong> es un proceso en que el estado inicial y final coinciden.</p>
<h4>Procesos especiales</h4>
<table class="t">
<thead><tr><th>Proceso</th><th>Condición</th><th>n politróp.</th></tr></thead>
<tbody>
<tr><td>Isobárico</td><td>P = cte</td><td>n = 0</td></tr>
<tr><td>Isotérmico</td><td>T = cte</td><td>n = 1</td></tr>
<tr><td>Isocórico</td><td>v = cte</td><td>n = ∞</td></tr>
<tr><td>Adiabático</td><td>Q = 0</td><td>n = γ</td></tr>
</tbody>
</table>
<div class="co mu"><strong>Equilibrios:</strong> Mecánico (P uniforme) · Térmico (T uniforme) · Químico (composición constante).</div>
</div>
</div>
</div>
${navStrip('n11')}
</section>`}

<section class="sec" id="s-n12">
<div class="sh">
<div class="badge">1.2</div>
<h1>Propiedades de las <em>sustancias</em></h1>

<div class="fblock hot">$$PV = nR_uT \\qquad PV = mRT \\qquad Pv = RT$$</div>

<div class="th" style="margin-top:14px">
<h3>Relaciones $c_p$, $c_v$, $R$, $\\gamma$</h3>
<div class="fblock">$$c_p = c_v + R \\qquad \\gamma = c_p/c_v$$

<table class="t">

<!-- SUSTANCIAS PURAS & FASES -->
<div class="grid2" style="margin-top:18px">
<div class="th">
<h3>Sustancias puras y cambio de fase</h3>
<p>Una <strong>sustancia pura</strong> tiene composición química uniforme e inmutable (H₂O, CO₂, N₂...).</p>
<p><strong>Fase</strong>: región espacial con propiedades físicas uniformes. Los cambios de fase implican cambios de estado.</p>
<h4>Punto crítico del agua</h4>
<div class="fblock">$$T_{cr} = 373.95\\,°C \\qquad P_{cr} = 22.06\\,\\text{MPa}$$</div>
<p>Por encima del punto crítico no existe evaporación definida: <strong>fluido supercrítico</strong>.</p>
<h4>Punto triple del agua</h4>
<div class="fblock">$$T_{tr} = 0.01\\,°C \\qquad P_{tr} = 0.6117\\,\\text{kPa}$$</div>
<div class="co mu"><strong>Sublimación</strong>: paso directo de sólido a gas (sin pasar por líquido) por debajo de la presión del punto triple.</div>
</div>
<div>
<div class="diagram">

<p>En la zona de mezcla saturada líquido-vapor, la <strong>calidad</strong> indica la fracción másica de vapor:</p>
<div class="fblock">$$x = \\frac{m_{vap}}{m_{tot}} = \\frac{m_{vap}}{m_{liq}+m_{vap}} \\qquad x=0\\text{ (líq. sat.)}\\quad x=1\\text{ (vap. sat.)}$$</div>
<p>El volumen específico de la mezcla se calcula por la regla de la palanca:</p>
<div class="fblock">$$v_{avg} = (1-x)\\,v_f + x\\,v_g \\qquad \\Rightarrow \\qquad x = \\frac{v_{avg}-v_f}{v_{fg}}$$</div>
<div class="ctrl" style="max-width:400px"><div class="ctrl-row"><span class="nm">Calidad x</span><span class="vl" id="xq-v">0.5</span></div><input type="range" id="xq-sl" min="0" max="1" step="0.01" value="0.5"></div>

$$x_i = m_i/m_m \\;\\text{(fracc. másica)}$$
$$y_i = N_i/N_m \\;\\text{(fracc. molar)}$$</div>
<div class="fblock cold">$$P_m = \\sum P_i(T_m,V_m)\\;\\text{(Dalton)}$$
$$V_m = \\sum V_i(T_m,P_m)\\;\\text{(Amagat)}$$
$$P_i/P_m = V_i/V_m = N_i/N_m = y_i$$</div>
</div>
<div class="fgrid">
<div class="fblock">$$c_{v,m} = \\sum c_{v,i}x_i \\qquad c_{p,m} = \\sum c_{p,i}x_i$$</div>
<div class="fblock">$$PM_m = \\sum y_i PM_i \\qquad R_m = R_u/PM_m$$</div>
</div>

<div class="fblock cold">$$\\omega = \\frac{m_v}{m_a} = 0.622\\,\\frac{P_v}{P_a} \\quad\\left[\\frac{\\text{kg vapor}}{\\text{kg aire seco}}\\right]$$
<small>$\\omega$ = humedad específica (ratio de humedad)</small></div>
<div class="fblock">$$\\phi = \\frac{m_v}{m_g} = \\frac{P_v}{P_g} \\qquad P_g = P_{sat\\,@\\,T}$$
<small>$\\phi$ = humedad relativa [—]</small></div>
</div>
<div class="fblock">$$h = h_a + \\omega h_v \\qquad h_a = c_{p,a}T = 1.005\\,T\\;\\text{[kJ/kg]}$$
$$h_v(T) \\approx 2500.9 + 1.82\\,T\\;\\text{[kJ/kg]}\\quad(T\\text{ en °C})$$</div>
<div class="fblock mu">$$T_{dp} = T_{sat\\,@\\,P_v} \\qquad\\text{(temperatura de punto de rocío)}$$</div>

</ul>

</div>

$$\\phi = (u-u_0)+P_0(v-v_0)-T_0(s-s_0)+\\frac{V^2}{2}+gz \\;[\\text{J/kg}]$$
$$\\Delta\\phi = (e_2-e_1)+P_0(v_2-v_1)-T_0(s_2-s_1)$$</div>

function wireAll(){
  // 1.1 Temperature converter
  const tcSl=document.getElementById('tc-sl');
  if(tcSl)tcSl.addEventListener('input',function(){
    const c=+this.value;
    document.getElementById('tc-v').textContent=c;
    document.getElementById('conv-k').textContent=(c+273.15).toFixed(2);
    document.getElementById('conv-r').textContent=((c+273.15)*1.8).toFixed(2);
    document.getElementById('conv-f').textContent=(c*1.8+32).toFixed(2);
  });

  // 1.2 T-v diagram
  const tvSl=document.getElementById('tvP-sl');
  if(tvSl){tvSl.addEventListener('input',function(){document.getElementById('tvP-v').textContent=(+this.value).toFixed(1);drawTV()});drawTV();}

  // 1.2 Quality
  const xSl=document.getElementById('xq-sl');
  if(xSl){xSl.addEventListener('input',function(){document.getElementById('xq-v').textContent=(+this.value).toFixed(2);updateQuality(+this.value)});updateQuality(0.5);}

  // 1.2 Ideal gas
  igWire();

  // 1.2 Atmospheric air
  ['ah-tsl','ah-phisl'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',calcAH)});calcAH();

  // 1.3 Polytropic
  const ptSl=document.getElementById('pt-n-sl');
  if(ptSl)ptSl.addEventListener('input',function(){document.getElementById('pt-n-v').textContent=(+this.value).toFixed(2);calcPoly()});
  const ptR=document.getElementById('pt-r-sl');
  if(ptR)ptR.addEventListener('input',function(){document.getElementById('pt-r-v').textContent=(+this.value).toFixed(1);calcPoly()});
  const ptT=document.getElementById('pt-t1-sl');
  if(ptT)ptT.addEventListener('input',function(){document.getElementById('pt-t1-v').textContent=this.value;calcPoly()});
  document.querySelectorAll('.dtab[data-n]').forEach(b=>b.addEventListener('click',function(){
    document.querySelectorAll('.dtab[data-n]').forEach(x=>x.classList.remove('on'));this.classList.add('on');
    const n=+this.dataset.n;document.getElementById('pt-n-sl').value=n<3?n:3;document.getElementById('pt-n-v').textContent=n<90?n:'∞';calcPoly();
  }));
  calcPoly();

  // 1.3 Devices
  document.querySelectorAll('#dev-tabs .dtab').forEach(b=>b.addEventListener('click',function(){
    document.querySelectorAll('#dev-tabs .dtab').forEach(x=>x.classList.remove('on'));this.classList.add('on');
    showDevice(this.dataset.d);setTimeout(()=>mjSet(document.getElementById('dev-content')),100);
  }));showDevice('nozzle');setTimeout(()=>mjSet(document.getElementById('dev-content')),200);

  // 1.4 Heat engine
  ['he-thsl','he-tlsl','he-fracsl'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',calcHE)});calcHE();

  // 1.4 Entropy change
  ['ds-tsl','ds-psl'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',calcDS)});calcDS();

  // 1.4 Isentropic efficiency
  const effSl=document.getElementById('eff-sl');
  if(effSl)effSl.addEventListener('input',function(){document.getElementById('eff-v').textContent=(+this.value).toFixed(2);drawEfficiency()});
  document.querySelectorAll('#eff-tabs .dtab').forEach(b=>b.addEventListener('click',function(){
    document.querySelectorAll('#eff-tabs .dtab').forEach(x=>x.classList.remove('on'));this.classList.add('on');
    drawEfficiency();setTimeout(()=>mjSet(document.getElementById('eff-formula')),100);
  }));drawEfficiency();

  // 1.5 Exergy destruction
  ['xd-t0sl','xd-sgsl'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',calcXD)});calcXD();
}

  svgEl(svg,'line',{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:'#9AA0AE','stroke-width':1});
  svgEl(svg,'text',{x:W-MR,y:H-MB+18,'text-anchor':'end','font-size':11,fill:'#4A5168'},'v [m³/kg]');
  svgEl(svg,'text',{x:ML-8,y:MT+4,'font-size':11,fill:'#4A5168','text-anchor':'end'},'T [°C]');
  // Log scale on v
  const Tmax=400,vmin=0.0008,vmax=200;
  function px(v){return ML+(Math.log(Math.max(v,vmin))-Math.log(vmin))/(Math.log(vmax)-Math.log(vmin))*(W-ML-MR)}
  function py(T){return H-MB-(T/Tmax)*(H-MT-MB)}
  // Grid lines (T)
  [100,200,300,374].forEach(T=>{
    svgEl(svg,'line',{x1:ML,y1:py(T),x2:W-MR,y2:py(T),stroke:'#EEF0F4','stroke-width':.5});
    svgEl(svg,'text',{x:ML-4,y:py(T)+3,'text-anchor':'end','font-size':9,fill:'#9AA0AE'},T);
  });
  // Grid lines (v) - log decades
  [0.001,0.01,0.1,1,10,100].forEach(v=>{
    if(v>=vmin&&v<=vmax){
      svgEl(svg,'line',{x1:px(v),y1:MT,x2:px(v),y2:H-MB,stroke:'#EEF0F4','stroke-width':.5});
      svgEl(svg,'text',{x:px(v),y:H-MB+14,'text-anchor':'middle','font-size':8,fill:'#9AA0AE'},v<1?v.toFixed(3).replace(/0+$/,''):v.toString());
    }
  });
  // Real saturation dome from WATER_SAT table
  const liqPts=WATER_SAT.map(r=>`${px(r[2])},${py(r[0])}`).join(' ');
  const vapPts=WATER_SAT.slice().reverse().map(r=>`${px(r[3])},${py(r[0])}`).join(' ');
  svgEl(svg,'polyline',{points:liqPts,fill:'none',stroke:'#0369A1','stroke-width':2});
  svgEl(svg,'polyline',{points:vapPts,fill:'none',stroke:'#C84B1A','stroke-width':2});
  // Critical point
  const cr=WATER_SAT[WATER_SAT.length-1];
  svgEl(svg,'circle',{cx:px(cr[2]),cy:py(cr[0]),r:5,fill:'#C84B1A',stroke:'#fff','stroke-width':2});
  svgEl(svg,'text',{x:px(cr[2])+8,y:py(cr[0])+4,'font-size':10,fill:'#C84B1A','font-weight':700},'Punto crítico');
  svgEl(svg,'text',{x:px(cr[2])+8,y:py(cr[0])+18,'font-size':9,fill:'#4A5168'},'374°C · 22 MPa');
  // Current isobar
  const sat=waterSatAtP(P_kPa);
  const Tsat=sat[0],vf=sat[2],vg=sat[3];
  // Compressed liquid (near vf, lower T)
  const T_low=Math.max(10,Tsat-50);
  svgEl(svg,'line',{x1:px(vf*0.99),y1:py(T_low),x2:px(vf),y2:py(Tsat),stroke:'#1CBBBB','stroke-width':2.5});
  // Two-phase horizontal
  svgEl(svg,'line',{x1:px(vf),y1:py(Tsat),x2:px(vg),y2:py(Tsat),stroke:'#1CBBBB','stroke-width':3});
  // Superheated curve - rising T with v
  const shPts=[];
  for(let vv=vg;vv<vmax;vv*=1.4){
    // Ideal gas approx: T = P*v/R_water (P constant), so T rises with v
    const T_sh=Tsat+50*(Math.log(vv/vg)/Math.log(2));
    if(T_sh<Tmax&&T_sh>Tsat)shPts.push(`${px(vv)},${py(T_sh)}`);
  }
  svgEl(svg,'polyline',{points:shPts.join(' '),fill:'none',stroke:'#1CBBBB','stroke-width':2.5,'stroke-dasharray':'3 3'});
  // Endpoint dots
  svgEl(svg,'circle',{cx:px(vf),cy:py(Tsat),r:4,fill:'#1CBBBB',stroke:'#fff','stroke-width':1.5});
  svgEl(svg,'circle',{cx:px(vg),cy:py(Tsat),r:4,fill:'#1CBBBB',stroke:'#fff','stroke-width':1.5});
  svgEl(svg,'text',{x:px(vf)-12,y:py(Tsat)-6,'font-size':10,fill:'#138F8F','font-weight':700},'L_sat');
  svgEl(svg,'text',{x:px(vg)+6,y:py(Tsat)-6,'font-size':10,fill:'#138F8F','font-weight':700},'V_sat');
  // Region labels
  svgEl(svg,'text',{x:px(0.0009),y:py(180),'font-size':9,fill:'#0369A1','text-anchor':'start'},'Líq.');
  svgEl(svg,'text',{x:px(0.05),y:py(140),'font-size':9,fill:'#4A5168','font-style':'italic'},'Mezcla');
  svgEl(svg,'text',{x:px(20),y:py(150),'font-size':9,fill:'#C84B1A'},'Vap. recalent.');
  // State strip
  const strip=document.getElementById('tv-state');
  if(strip)strip.innerHTML=`
    <div class="mchip"><div class="mval">${P_bar.toFixed(1)}</div><div class="mlbl">P [bar]</div></div>
    <div class="mchip"><div class="mval cold">${Tsat.toFixed(1)}</div><div class="mlbl">T_sat [°C]</div></div>
    <div class="mchip"><div class="mval hot">${vf.toFixed(5)}</div><div class="mlbl">v_f [m³/kg]</div></div>
    <div class="mchip"><div class="mval">${vg.toFixed(4)}</div><div class="mlbl">v_g [m³/kg]</div></div>
  `;
}

}

const _igUser=new Set();
function igGetR(){const s=document.getElementById('ig-gas');if(!s)return 287;const v=+s.value;return v===0?(+document.getElementById('ig-r-sl').value||287):v;}
function igWire(){
  const ids=['ig-P','ig-V','ig-T'];
  ids.forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.addEventListener('input',function(){
      if(this.value.trim()!==''&&!this.classList.contains('ig-computed'))_igUser.add(id);
      else _igUser.delete(id);
      igCalc();
    });
  });
  document.querySelectorAll('.ig-clr').forEach(btn=>btn.addEventListener('click',function(){
    const tid=this.dataset.target;_igUser.delete(tid);
    const el=document.getElementById(tid);if(el){el.value='';el.classList.remove('ig-computed');}
    igCalc();
  }));
  const gasSel=document.getElementById('ig-gas');
  if(gasSel)gasSel.addEventListener('change',function(){
    const cr=document.getElementById('ig-custom-r');
    if(cr)cr.style.display=this.value==='0'?'block':'none';
    igCalc();
  });
  const rSl=document.getElementById('ig-r-sl');
  if(rSl)rSl.addEventListener('input',function(){
    const d=document.getElementById('ig-r-disp');if(d)d.textContent=this.value;igCalc();
  });
}
function igCalc(){
  const R=igGetR();
  const ids=['ig-P','ig-V','ig-T'];
  const labels={P:'P','V':'v','T':'T'};
  const units={'ig-P':'kPa','ig-V':'m³/kg','ig-T':'K'};
  const res=document.getElementById('ig-result');
  const rhoStrip=document.getElementById('ig-rho-strip');
  // Clear computed styling on user-set fields
  ids.forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    if(_igUser.has(id)){el.classList.remove('ig-computed');}
  });
  const n=_igUser.size;
  if(n===0){
    ids.forEach(id=>{const el=document.getElementById(id);if(el){el.value='';el.classList.remove('ig-computed');}});
    res.className='ig-result ig-hint';res.innerHTML='Introduce 2 de las 3 propiedades (P, v, T) para calcular la tercera.';
    if(rhoStrip)rhoStrip.style.display='none';return;
  }
  if(n===1){
    const missing=ids.filter(id=>!_igUser.has(id));
    missing.forEach(id=>{const el=document.getElementById(id);if(el){el.value='';el.classList.remove('ig-computed');}});
    res.className='ig-result';res.innerHTML='<div class="ig-warn">⚠ Introduce 1 propiedad más para calcular.</div>';
    if(rhoStrip)rhoStrip.style.display='none';return;
  }
  const pRaw=_igUser.has('ig-P')?+document.getElementById('ig-P').value:null;
  const vRaw=_igUser.has('ig-V')?+document.getElementById('ig-V').value:null;
  const tRaw=_igUser.has('ig-T')?+document.getElementById('ig-T').value:null;
  if(n===2){
    let compId,compVal,formula;
    if(pRaw===null){compVal=R*tRaw/(vRaw*1000);compId='ig-P';formula=`P = R·T / v = ${R}×${tRaw} / (${vRaw}×1000) = <strong>${compVal.toFixed(2)} kPa</strong>`;}
    else if(vRaw===null){compVal=R*tRaw/(pRaw*1000);compId='ig-V';formula=`v = R·T / P = ${R}×${tRaw} / (${pRaw}×1000) = <strong>${compVal.toFixed(5)} m³/kg</strong>`;}
    else{compVal=pRaw*1000*vRaw/R;compId='ig-T';formula=`T = P·v / R = (${pRaw}×1000)×${vRaw} / ${R} = <strong>${compVal.toFixed(2)} K</strong>`;}
    if(compVal<=0||!isFinite(compVal)){res.className='ig-result';res.innerHTML='<div class="ig-err">✗ Valores inválidos (resultado ≤ 0).</div>';return;}
    const compEl=document.getElementById(compId);
    const dp=compId==='ig-V'?5:2;
    compEl.value=compVal.toFixed(dp);
    compEl.classList.add('ig-computed');
    const vFinal=compId==='ig-V'?compVal:vRaw??compVal;
    res.className='ig-result';
    res.innerHTML=`<div class="ig-ok">✓ <strong>${compId.replace('ig-','')}</strong> calculada: <strong>${compEl.value} ${units[compId]}</strong></div><div class="ig-formula">${formula}</div>`;
    const rhoEl=document.getElementById('ig-rho-val');if(rhoEl)rhoEl.textContent=(1/vFinal).toFixed(4);
    if(rhoStrip)rhoStrip.style.display='flex';return;
  }
  if(n===3){
    const lhs=pRaw*1000*vRaw,rhs=R*tRaw;
    const err=Math.abs(lhs-rhs)/rhs*100;
    const ok=err<1;
    res.className='ig-result';
    res.innerHTML=ok
      ?`<div class="ig-ok">✓ Sistema definido correctamente &nbsp;<small style="opacity:.75">(discrepancia ${err.toFixed(2)}%)</small><br><small style="font-family:var(--mono)">P·v = ${lhs.toFixed(1)} J/kg &nbsp;≈&nbsp; R·T = ${rhs.toFixed(1)} J/kg</small></div>`
      :`<div class="ig-err">✗ Sistema inconsistente &mdash; error ${err.toFixed(1)}%<br><small style="font-family:var(--mono)">P·v = ${lhs.toFixed(1)} J/kg &nbsp;≠&nbsp; R·T = ${rhs.toFixed(1)} J/kg</small></div>`;
    const rhoEl=document.getElementById('ig-rho-val');if(rhoEl)rhoEl.textContent=(1/vRaw).toFixed(4);
    if(rhoStrip)rhoStrip.style.display='flex';
  }
}
function calcIG(){igCalc();}

function calcAH(){
  const T=+document.getElementById('ah-tsl').value;
  const phi=+document.getElementById('ah-phisl').value/100;
  document.getElementById('ah-t').textContent=T;
  document.getElementById('ah-phi').textContent=(phi*100).toFixed(0);
  // Antoine approx for water
  const Psat=0.6113*Math.exp(17.27*T/(T+237.3)); // kPa
  const Pv=phi*Psat;
  const Pa=101.325-Pv;
  const omega=0.622*Pv/Math.max(Pa,0.001);
  const h=1.005*T+omega*(2500.9+1.82*T);
  const Tdp_K=243.5*Math.log(Pv/0.6113)/(17.27-Math.log(Pv/0.6113));
  const el=document.getElementById('ah-strip');
  if(el)el.innerHTML=`
    <div class="mchip"><div class="mval cold">${(Pv*1000).toFixed(1)}</div><div class="mlbl">P_v [Pa]</div></div>
    <div class="mchip"><div class="mval">${omega.toFixed(4)}</div><div class="mlbl">ω [kg_v/kg_a]</div></div>
    <div class="mchip"><div class="mval jade">${h.toFixed(1)}</div><div class="mlbl">h [kJ/kg_a]</div></div>
    <div class="mchip"><div class="mval hot">${isNaN(Tdp_K)?'—':Tdp_K.toFixed(1)}</div><div class="mlbl">T_dp [°C]</div></div>
  `;
}

/* ---------- 1.3 POLYTROPIC ---------- */
function calcPoly(){
  const n=+document.getElementById('pt-n-sl').value;
  const r=+document.getElementById('pt-r-sl').value;
  const T1=+document.getElementById('pt-t1-sl').value;
  const P1=100;
  const v1=1;
  const v2=v1/r;
  let P2,T2,W,Q,label,fmla;
  if(n<0.05){P2=P1;T2=T1*(v2/v1);W=P1*(v2-v1);Q=W+CV*(T2-T1)/1000;label='Isobárico';fmla='P = cte,\\;n=0,\\;c=c_p,\\;W=P\\Delta V'}
  else if(Math.abs(n-1)<0.05){P2=P1*(v1/v2);T2=T1;W=P1*v1*Math.log(v1/v2);Q=W;label='Isotérmico';fmla='T = cte,\\;n=1,\\;c=\\pm\\infty,\\;W=mRT\\ln(V_2/V_1)'}
  else if(n>2.5){P2=P1*r;T2=T1;W=0;Q=CV*(T2-T1);label='Isocórico';fmla='v = cte,\\;n=\\infty,\\;c=c_v,\\;W=0'}
  else{P2=P1*Math.pow(v1/v2,n);T2=T1*Math.pow(v1/v2,n-1);W=(P2*v2-P1*v1)/(1-n);Q=(CV*(T2-T1)/1000)+W;label=`Politrópico n=${n.toFixed(2)}`;fmla=`Pv^n=cte,\\;n=${n.toFixed(2)},\\;W=(P_2v_2-P_1v_1)/(1-n)`}
  document.getElementById('pt-strip').innerHTML=`
    <div class="mchip"><div class="mval hot">${P2.toFixed(1)}</div><div class="mlbl">P₂ [kPa]</div></div>
    <div class="mchip"><div class="mval cold">${T2.toFixed(1)}</div><div class="mlbl">T₂ [K]</div></div>
    <div class="mchip"><div class="mval jade">${W.toFixed(2)}</div><div class="mlbl">w [kJ/kg]</div></div>
    <div class="mchip"><div class="mval">${label}</div><div class="mlbl">Tipo</div></div>
  `;
  document.getElementById('pt-formula').innerHTML=`<div style="overflow-x:auto">$$${fmla}$$</div>`;
  mjSet(document.getElementById('pt-formula'));
  drawPolytropic(n,P1,v1,P2,v2,T1,T2);
  drawPolytropicTS(n,T1,T2,v1,v2,P1,P2);
}

function drawPolytropic(n,P1,v1,P2,v2,T1,T2){
  const svg=document.getElementById('pt-pv');if(!svg)return;clr(svg);
  const W=340,H=240,ML=50,MR=18,MT=15,MB=32;
  svgEl(svg,'line',{x1:ML,y1:H-MB,x2:W-MR,y2:H-MB,stroke:'#9AA0AE','stroke-width':1});
  svgEl(svg,'line',{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:'#9AA0AE','stroke-width':1});
  svgEl(svg,'text',{x:W-MR,y:H-MB+16,'text-anchor':'end','font-size':10,fill:'#4A5168'},'v →');
  svgEl(svg,'text',{x:ML-8,y:MT+4,'font-size':10,fill:'#4A5168','text-anchor':'end'},'P');
  // For isochoric (n>2.5), v stays at v1, P varies
  const isIsochoric=n>2.5;
  let vmin,vmax,Pmax;
  if(isIsochoric){
    vmin=v1*0.5;vmax=v1*1.5;Pmax=Math.max(P1,P2)*1.15;
  }else{
    vmin=Math.min(v1,v2)*0.6;vmax=Math.max(v1,v2)*1.3;Pmax=Math.max(P1,P2)*1.2;
  }
  function px(v){return ML+(v-vmin)/(vmax-vmin)*(W-ML-MR)}
  function py(P){return H-MB-P/Pmax*(H-MT-MB)}
  // P grid
  [100,200,300,500,1000].forEach(P=>{if(P<=Pmax){
    svgEl(svg,'line',{x1:ML,y1:py(P),x2:W-MR,y2:py(P),stroke:'#EEF0F4','stroke-width':.5});
    svgEl(svg,'text',{x:ML-4,y:py(P)+3,'text-anchor':'end','font-size':8,fill:'#9AA0AE'},P+'');
  }});
  // Build curve
  const pts=[];
  if(isIsochoric){
    // Vertical line at v=v1 from P1 to P2
    const Ns=20;
    for(let i=0;i<=Ns;i++){
      const P=P1+(P2-P1)*i/Ns;
      pts.push(`${px(v1)},${py(P)}`);
    }
    svgEl(svg,'polyline',{points:pts.join(' '),fill:'none',stroke:'#1CBBBB','stroke-width':3});
    // Show "no area" - W=0
    svgEl(svg,'text',{x:(ML+W-MR)/2,y:(MT+H-MB)/2,'text-anchor':'middle','font-size':14,fill:'#16A34A','font-style':'italic','font-weight':600},'W = 0');
    svgEl(svg,'text',{x:(ML+W-MR)/2,y:(MT+H-MB)/2+18,'text-anchor':'middle','font-size':10,fill:'#4A5168'},'(no hay variación de volumen)');
  }else{
    const N=40;
    for(let i=0;i<=N;i++){
      const vv=v1+(v2-v1)*i/N;
      let PP;
      if(n<0.05)PP=P1; // isobaric
      else PP=P1*Math.pow(v1/Math.max(vv,0.001),n);
      pts.push(`${px(vv)},${py(PP)}`);
    }
    svgEl(svg,'polyline',{points:pts.join(' '),fill:'none',stroke:'#1CBBBB','stroke-width':2.5});
    // Area under curve (work)
    const area=[`${px(v1)},${py(0)}`,...pts,`${px(v2)},${py(0)}`].join(' ');
    svgEl(svg,'polygon',{points:area,fill:'rgba(28,187,187,.13)',stroke:'none'});
    svgEl(svg,'text',{x:(px(v1)+px(v2))/2,y:py(Math.max(P1,P2)*0.5),'text-anchor':'middle','font-size':11,fill:'#16A34A','font-style':'italic','font-weight':600},'W = ∫P dv');
  }
  // State dots
  [[v1,P1,'1'],[v1,P2,'2_isochoric'],[v2,P2,'2']].forEach(([v,P,l])=>{
    if(l==='2_isochoric'&&!isIsochoric)return;
    if(l==='2'&&isIsochoric)return;
    svgEl(svg,'circle',{cx:px(v),cy:py(P),r:6,fill:'#1CBBBB',stroke:'#fff','stroke-width':2});
    svgEl(svg,'text',{x:px(v)+8,y:py(P)-5,'font-size':11,fill:'#138F8F','font-weight':700},l.replace('_isochoric','').replace('_',''));
  });
}

function drawPolytropicTS(n,T1,T2,v1,v2,P1,P2){
  const svg=document.getElementById('pt-ts');if(!svg)return;clr(svg);
  const W=340,H=180,ML=50,MR=18,MT=15,MB=30;
  svgEl(svg,'line',{x1:ML,y1:H-MB,x2:W-MR,y2:H-MB,stroke:'#9AA0AE','stroke-width':1});
  svgEl(svg,'line',{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:'#9AA0AE','stroke-width':1});
  svgEl(svg,'text',{x:W-MR,y:H-MB+14,'text-anchor':'end','font-size':10,fill:'#4A5168'},'s [kJ/kg·K]');
  svgEl(svg,'text',{x:ML-8,y:MT+4,'font-size':10,fill:'#4A5168','text-anchor':'end'},'T [K]');
  const isIsochoric=n>2.5;
  const R_g=0.287;
  // Compute Δs (gas perfecto): Δs = cv·ln(T2/T1) + R·ln(v2/v1)
  const ds=CV*Math.log(T2/T1)+R_g*Math.log(v2/v1);
  // Bounds
  const Tmin=Math.min(T1,T2)*0.85,Tmax=Math.max(T1,T2)*1.15;
  const sScale=Math.max(0.4,Math.abs(ds)*2.5);
  const smin=-sScale/2,smax=sScale/2;
  function px(s){return ML+(s-smin)/(smax-smin)*(W-ML-MR)}
  function py(T){return H-MB-(T-Tmin)/(Tmax-Tmin)*(H-MT-MB)}
  // Grid
  [Math.round(Tmin/50)*50+50, Math.round(Tmax/50)*50-50].forEach(T=>{
    if(T>Tmin&&T<Tmax){
      svgEl(svg,'line',{x1:ML,y1:py(T),x2:W-MR,y2:py(T),stroke:'#EEF0F4','stroke-width':.5});
      svgEl(svg,'text',{x:ML-4,y:py(T)+3,'text-anchor':'end','font-size':9,fill:'#9AA0AE'},T);
    }
  });
  // Process trajectory
  const N=30;
  const pts=[];
  for(let i=0;i<=N;i++){
    const t=i/N;
    let T_curr,s_curr;
    if(isIsochoric){
      // T varies linearly with i, s changes via cv·ln(T/T1) (v=cte)
      T_curr=T1+(T2-T1)*t;
      s_curr=CV*Math.log(T_curr/T1);
    }else if(n<0.05){
      // Isobaric: s = cp·ln(T/T1)
      T_curr=T1+(T2-T1)*t;
      s_curr=CP*Math.log(T_curr/T1);
    }else if(Math.abs(n-1)<0.05){
      // Isothermal: T=cte, s changes via R·ln(v2/v1)
      T_curr=T1;
      s_curr=R_g*Math.log(1+(v2/v1-1)*t);
    }else{
      // Polytropic: v(t), T(t), s = cv·ln(T/T1) + R·ln(v/v1)
      const v_curr=v1+(v2-v1)*t;
      T_curr=T1*Math.pow(v1/v_curr,n-1);
      s_curr=CV*Math.log(T_curr/T1)+R_g*Math.log(v_curr/v1);
    }
    pts.push(`${px(s_curr)},${py(T_curr)}`);
  }
  // Process color depends on direction
  const col=T2>T1?'#C84B1A':T2<T1?'#0369A1':'#1CBBBB';
  svgEl(svg,'polyline',{points:pts.join(' '),fill:'none',stroke:col,'stroke-width':2.5});
  // Area under curve = q (heat) for reversible
  if(!isIsochoric){
    const area=[`${px(0)},${py(Tmin)}`,...pts,`${px(ds)},${py(Tmin)}`].join(' ');
    svgEl(svg,'polygon',{points:area,fill:col,opacity:.1,stroke:'none'});
  }
  // State 1 and 2
  svgEl(svg,'circle',{cx:px(0),cy:py(T1),r:5,fill:'#1CBBBB',stroke:'#fff','stroke-width':1.5});
  svgEl(svg,'circle',{cx:px(ds),cy:py(T2),r:5,fill:'#1CBBBB',stroke:'#fff','stroke-width':1.5});
  svgEl(svg,'text',{x:px(0)+6,y:py(T1)-4,'font-size':10,fill:'#138F8F','font-weight':700},'1');
  svgEl(svg,'text',{x:px(ds)+6,y:py(T2)-4,'font-size':10,fill:'#138F8F','font-weight':700},'2');
  // Heat indicator
  if(!isIsochoric&&Math.abs(ds)>0.01){
    svgEl(svg,'text',{x:(px(0)+px(ds))/2,y:py((T1+T2)/2)+18,'text-anchor':'middle','font-size':9,fill:col,'font-style':'italic'},`q = área (Δs=${ds.toFixed(3)})`);
  }
  if(isIsochoric)svgEl(svg,'text',{x:(ML+W-MR)/2,y:(MT+H-MB)/2,'text-anchor':'middle','font-size':11,fill:'#16A34A','font-style':'italic'},'q = cv·ΔT (no área P-v)');
}

/* ---------- 1.4 HEAT ENGINE ---------- */
function calcHE(){
  const TH=+document.getElementById('he-thsl').value;
  const TL=+document.getElementById('he-tlsl').value;
  const frac=+document.getElementById('he-fracsl').value;
  document.getElementById('he-th').textContent=TH;
  document.getElementById('he-tl').textContent=TL;
  document.getElementById('he-frac').textContent=frac.toFixed(2);
  const eta_c=1-TL/TH;
  const eta_real=Math.min(0.999,eta_c*frac);
  const cop_r=TL/(TH-TL);
  const cop_hp=TH/(TH-TL);
  const QH=100,QL=QH*(1-eta_real),W=QH*eta_real;
  const el=document.getElementById('he-metrics');
  if(el)el.innerHTML=`
    <div class="mchip"><div class="mval jade">${(eta_c*100).toFixed(1)}</div><div class="mlbl">η_Carnot [%]</div></div>
    <div class="mchip"><div class="mval ${eta_real>eta_c?'hot':'cold'}">${(eta_real*100).toFixed(1)}</div><div class="mlbl">η_real [%]</div></div>
    <div class="mchip"><div class="mval">${cop_r.toFixed(2)}</div><div class="mlbl">COP_R (rev)</div></div>
    <div class="mchip"><div class="mval mu">${cop_hp.toFixed(2)}</div><div class="mlbl">COP_HP (rev)</div></div>
  `;
  drawHE(TH,TL,QH,QL,W,eta_c,eta_real);
}

/* ---------- 1.4 ENTROPY CHANGE ---------- */
function calcDS(){
  const tratio=+document.getElementById('ds-tsl').value;
  const pratio=+document.getElementById('ds-psl').value;
  document.getElementById('ds-t').textContent=tratio.toFixed(1);
  document.getElementById('ds-p').textContent=pratio.toFixed(1);
  const R_gas=0.287;
  // Both formulas should give the same result
  // Δs = cv·ln(T2/T1) + R·ln(v2/v1) = cp·ln(T2/T1) - R·ln(P2/P1)
  // For our ratios: v2/v1 = (T2/T1)/(P2/P1) = tratio/pratio
  const ds_cv=CV*Math.log(tratio)+R_gas*Math.log(tratio/pratio);
  const ds_cp=CP*Math.log(tratio)-R_gas*Math.log(pratio);
  const el=document.getElementById('ds-strip');
  if(el)el.innerHTML=`
    <div class="mchip"><div class="mval ${ds_cp>0?'hot':'cold'}">${ds_cp.toFixed(4)}</div><div class="mlbl">Δs [kJ/kg·K]</div></div>
    <div class="mchip"><div class="mval jade">${ds_cv.toFixed(4)}</div><div class="mlbl">Δs verif. [kJ/kg·K]</div></div>
    <div class="mchip"><div class="mval mu">${(tratio/pratio).toFixed(3)}</div><div class="mlbl">v₂/v₁</div></div>
  `;
  drawDSdiagram(tratio,pratio);
}

function drawDSdiagram(tr,pr){
  const svg=document.getElementById('ds-svg');if(!svg)return;clr(svg);
  const W=340,H=240,ML=50,MR=14,MT=18,MB=36;
  // Axes
  svgEl(svg,'line',{x1:ML,y1:H-MB,x2:W-MR,y2:H-MB,stroke:'#9AA0AE','stroke-width':1});
  svgEl(svg,'line',{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:'#9AA0AE','stroke-width':1});
  svgEl(svg,'text',{x:W-MR,y:H-MB+16,'text-anchor':'end','font-size':10,fill:'#4A5168'},'s [kJ/kg·K]');
  svgEl(svg,'text',{x:ML-8,y:MT+4,'font-size':10,fill:'#4A5168','text-anchor':'end'},'T [K]');
  const T1=300,T2=T1*tr;
  const R_g=0.287;
  // Scale: smin to smax
  const ds_max=CP*Math.log(tr)-R_g*Math.log(pr);
  const sScale=Math.max(0.8,Math.abs(ds_max)*2.5);
  const smin=-sScale/2,smax=sScale/2;
  const Tmin=200,Tmax=Math.max(T2*1.2,500);
  function px(s){return ML+(s-smin)/(smax-smin)*(W-ML-MR)}
  function py(T){return H-MB-(T-Tmin)/(Tmax-Tmin)*(H-MT-MB)}
  // T grid
  [300,500,700,900,1200].forEach(T=>{if(T>=Tmin&&T<=Tmax){
    svgEl(svg,'line',{x1:ML,y1:py(T),x2:W-MR,y2:py(T),stroke:'#EEF0F4','stroke-width':.5});
    svgEl(svg,'text',{x:ML-4,y:py(T)+3,'text-anchor':'end','font-size':9,fill:'#9AA0AE'},T+'')
  }});
  // s grid
  [-0.5,0,0.5].forEach(s=>{if(s>=smin&&s<=smax){
    svgEl(svg,'line',{x1:px(s),y1:MT,x2:px(s),y2:H-MB,stroke:'#EEF0F4','stroke-width':.5});
    svgEl(svg,'text',{x:px(s),y:H-MB+14,'text-anchor':'middle','font-size':9,fill:'#9AA0AE'},s.toFixed(1)+'')
  }});
  // Isobaras background
  function drawIsobar(P_rel,col,label){
    const pts=[];
    for(let s=smin;s<=smax;s+=0.02){
      const T=T1*Math.exp((s+R_g*Math.log(P_rel))/CP);
      if(T>=Tmin&&T<=Tmax)pts.push(`${px(s)},${py(T)}`);
    }
    if(pts.length>1){
      svgEl(svg,'polyline',{points:pts.join(' '),fill:'none',stroke:col,'stroke-width':1.2,'stroke-dasharray':'4 3',opacity:.5});
      // Label at right edge
      const lastT=T1*Math.exp((smax+R_g*Math.log(P_rel))/CP);
      if(lastT<=Tmax&&lastT>=Tmin){
        svgEl(svg,'text',{x:W-MR-3,y:py(lastT)-3,'text-anchor':'end','font-size':9,fill:col,'font-style':'italic'},label);
      }
    }
  }
  drawIsobar(1,'#0369A1','P₁');
  drawIsobar(pr,'#C84B1A','P₂='+pr.toFixed(1)+'P₁');
  // States
  const s1=0,s2=CP*Math.log(tr)-R_g*Math.log(pr);
  // Process line
  svgEl(svg,'line',{x1:px(s1),y1:py(T1),x2:px(s2),y2:py(T2),stroke:'#1CBBBB','stroke-width':2.5});
  // State dots
  svgEl(svg,'circle',{cx:px(s1),cy:py(T1),r:6,fill:'#0369A1',stroke:'#fff','stroke-width':2});
  svgEl(svg,'circle',{cx:px(s2),cy:py(T2),r:6,fill:'#C84B1A',stroke:'#fff','stroke-width':2});
  svgEl(svg,'text',{x:px(s1)-8,y:py(T1)-8,'text-anchor':'end','font-size':11,fill:'#0369A1','font-weight':700},'1');
  svgEl(svg,'text',{x:px(s2)+8,y:py(T2)-8,'font-size':11,fill:'#C84B1A','font-weight':700},'2');
  // Δs label
  const mx=(px(s1)+px(s2))/2,my=(py(T1)+py(T2))/2;
  svgEl(svg,'rect',{x:mx-30,y:my-10,width:60,height:18,rx:3,fill:'#fff',opacity:.95});
  svgEl(svg,'text',{x:mx,y:my+3,'text-anchor':'middle','font-size':10,fill:'#1CBBBB','font-weight':700},'Δs = '+s2.toFixed(3));
}

/* ---------- 1.4 ISENTROPIC EFF ---------- */
function drawEfficiency(){
  const eta=+document.getElementById('eff-sl').value;
  const tab=document.querySelector('#eff-tabs .dtab.on');
  const type=tab?tab.dataset.e:'turbine';
  let fmla,comment;
  if(type==='turbine'){
    fmla=`$$\\eta_{is,t} = \\frac{w_{real}}{w_{ideal}} = \\frac{h_1-h_{2a}}{h_1-h_{2s}}$$`;
    comment='La expansión real termina con mayor entalpía que la isentrópica → h₂a > h₂s';
  }else if(type==='compressor'){
    fmla=`$$\\eta_{is,c} = \\frac{w_{ideal}}{w_{real}} = \\frac{h_{2s}-h_1}{h_{2a}-h_1}$$`;
    comment='La compresión real requiere más trabajo → h₂a > h₂s';
  }else{
    fmla=`$$\\eta_{is,N} = \\frac{(c^2/2)_{real}}{(c^2/2)_{ideal}} = \\frac{V_{2a}^2}{V_{2s}^2}$$`;
    comment='La tobera real convierte menos entalpía en energía cinética';
  }
  document.getElementById('eff-formula').innerHTML=`<div class="fblock jade">${fmla}<div class="co jade" style="margin-top:8px"><strong>η_is = ${(eta*100).toFixed(0)}%</strong> — ${comment}</div></div>`;
  mjSet(document.getElementById('eff-formula'));
  drawHSdiagram(eta,type);
}

function drawHSdiagram(eta,type){
  const svg=document.getElementById('eff-hs');if(!svg)return;clr(svg);
  const W=340,H=240,ML=50,MR=24,MT=20,MB=36;
  const PW=W-ML-MR,PH=H-MT-MB;
  const hmin=0,hmax=100;
  function px(s){return ML+s*PW}            // s already in [0,1]
  function py(h){return H-MB-(h-hmin)/hmax*PH}

  // ── Arrowhead markers ──────────────────────────────────────────
  const df=svgEl(svg,'defs',{});
  [['hs-g','#16A34A'],['hs-r','#C84B1A'],['hs-d','#9AA0AE']].forEach(([id,col])=>{
    const m=svgEl(df,'marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'});
    svgEl(m,'path',{d:'M0,1 L10,5 L0,9 z',fill:col});
  });

  // ── Cuadrícula ─────────────────────────────────────────────────
  [0.25,0.5,0.75].forEach(s=>{
    svgEl(svg,'line',{x1:px(s),y1:MT,x2:px(s),y2:H-MB,stroke:'#EEF0F4','stroke-width':.8});
  });
  [25,50,75].forEach(h=>{
    svgEl(svg,'line',{x1:ML,y1:py(h),x2:W-MR,y2:py(h),stroke:'#EEF0F4','stroke-width':.8});
  });

  // ── Ejes ───────────────────────────────────────────────────────
  svgEl(svg,'line',{x1:ML,y1:H-MB,x2:W-MR+4,y2:H-MB,stroke:'#9AA0AE','stroke-width':1.5,'marker-end':'url(#hs-d)'});
  svgEl(svg,'line',{x1:ML,y1:H-MB,x2:ML,y2:MT-4,stroke:'#9AA0AE','stroke-width':1.5,'marker-end':'url(#hs-d)'});
  svgEl(svg,'text',{x:W-MR+8,y:H-MB+4,'font-size':11,fill:'#4A5168'},'s →');
  svgEl(svg,'text',{x:ML,y:MT-7,'text-anchor':'middle','font-size':11,fill:'#4A5168','font-weight':600},'h');

  // ── Isobaras curvas: h = a + b·s + c·s² ───────────────────────
  // Curvatura realista (T crece a lo largo de la isobara)
  const b=55,c=8,aH=30,aL=-5;
  function hH(s){return aH+b*s+c*s*s}   // presión alta P₁
  function hL(s){return aL+b*s+c*s*s}   // presión baja P₂

  function drawIso(hFn,col,lbl){
    const pts=[];
    for(let s=0;s<=1.02;s+=0.025){
      const h=hFn(s);
      if(h>=-2&&h<=hmax+2)pts.push(`${px(s).toFixed(1)},${py(h).toFixed(1)}`);
    }
    if(pts.length>1)svgEl(svg,'polyline',{points:pts.join(' '),fill:'none',stroke:col,'stroke-width':2,'stroke-dasharray':'6 3',opacity:.85});
    const sl=0.78,hl=hFn(sl);
    if(hl>=0&&hl<=hmax)svgEl(svg,'text',{x:px(sl)+4,y:py(hl)-3,'font-size':10,fill:col,'font-weight':700},lbl);
  }
  drawIso(hH,'#C84B1A','P₁ alta');
  drawIso(hL,'#0369A1','P₂ baja');

  // ── Estados ────────────────────────────────────────────────────
  const isTurb=type==='turbine'||type==='nozzle';
  let s1,h1,s2s,h2s,s2a,h2a;
  if(isTurb){
    s1=0.28; h1=hH(s1);
    s2s=s1;  h2s=hL(s2s);
    h2a=h1-eta*(h1-h2s);
    // hL(s2a)=h2a → c·s²+b·s+(aL−h2a)=0
    const D=b*b-4*c*(aL-h2a);
    s2a=(-b+Math.sqrt(D))/(2*c);
  }else{
    s1=0.22; h1=hL(s1);
    s2s=s1;  h2s=hH(s2s);
    h2a=h1+(h2s-h1)/eta;
    // hH(s2a)=h2a → c·s²+b·s+(aH−h2a)=0
    const D=b*b-4*c*(aH-h2a);
    s2a=(-b+Math.sqrt(D))/(2*c);
  }

  // ── Zona de irreversibilidad (polígono sombreado) ───────────────
  // Triángulo: proceso real (1→2a) + isobara P₂ (2a→2s) + isentrópico (2s→1)
  if(eta<0.999){
    const hFn=isTurb?hL:hH;
    const poly=[`${px(s1)},${py(h1)}`,`${px(s2a)},${py(h2a)}`];
    for(let t=0;t<=1;t+=0.08){
      const s=s2a+(s2s-s2a)*t;
      poly.push(`${px(s).toFixed(1)},${py(hFn(s)).toFixed(1)}`);
    }
    poly.push(`${px(s1)},${py(h1)}`);
    svgEl(svg,'polygon',{points:poly.join(' '),fill:'#C84B1A',opacity:.15});
    // Etiqueta de irreversibilidad dentro de la zona
    const six=(s1+s2a+s2s)/3,hix=(h1+h2a+h2s)/3;
    svgEl(svg,'text',{x:px(six)+2,y:py(hix),'font-size':8,fill:'#C84B1A',opacity:.9,'font-style':'italic'},'Irrev.');
  }

  // ── Proceso isentrópico: verde discontinuo + flecha ─────────────
  svgEl(svg,'line',{
    x1:px(s2s),y1:py(h1)+(isTurb?7:-7),
    x2:px(s2s),y2:py(h2s)+(isTurb?-7:7),
    stroke:'#16A34A','stroke-width':2.5,'stroke-dasharray':'6 3',
    'marker-end':'url(#hs-g)'
  });

  // ── Proceso real: rojo sólido + flecha ─────────────────────────
  svgEl(svg,'line',{
    x1:px(s1),y1:py(h1)+(isTurb?7:-7),
    x2:px(s2a),y2:py(h2a)+(isTurb?-7:7),
    stroke:'#C84B1A','stroke-width':2.5,
    'marker-end':'url(#hs-r)'
  });

  // ── Línea horizontal de referencia h₁ (ayuda visual) ──────────
  svgEl(svg,'line',{
    x1:px(s2s),y1:py(h1),x2:px(s2s)+40,y2:py(h1),
    stroke:'#9AA0AE','stroke-width':.8,'stroke-dasharray':'3 3',opacity:.6
  });

  // ── Círculos de estado ─────────────────────────────────────────
  svgEl(svg,'circle',{cx:px(s1),cy:py(h1),r:5.5,fill:'#1CBBBB',stroke:'#fff','stroke-width':2});
  svgEl(svg,'circle',{cx:px(s2s),cy:py(h2s),r:5.5,fill:'#16A34A',stroke:'#fff','stroke-width':2});
  svgEl(svg,'circle',{cx:px(s2a),cy:py(h2a),r:5.5,fill:'#C84B1A',stroke:'#fff','stroke-width':2});

  // ── Etiquetas de estado ────────────────────────────────────────
  svgEl(svg,'text',{x:px(s1)-9,y:py(h1)-5,'text-anchor':'end','font-size':12,fill:'#1A1F2E','font-weight':700},'1');
  if(isTurb){
    svgEl(svg,'text',{x:px(s2s)-9,y:py(h2s)+14,'text-anchor':'end','font-size':11,fill:'#16A34A','font-weight':700},'2s');
    svgEl(svg,'text',{x:px(s2a)+8,y:py(h2a),'font-size':11,fill:'#C84B1A','font-weight':700},'2a');
  }else{
    svgEl(svg,'text',{x:px(s2s)-9,y:py(h2s)-5,'text-anchor':'end','font-size':11,fill:'#16A34A','font-weight':700},'2s');
    svgEl(svg,'text',{x:px(s2a)+8,y:py(h2a)+4,'font-size':11,fill:'#C84B1A','font-weight':700},'2a');
  }

  // ── Anotaciones Δh (labels en líneas) ─────────────────────────
  // Δh_s: en el proceso isentrópico (izquierda de la línea vertical)
  const lys=(py(h1)+py(h2s))/2;
  svgEl(svg,'rect',{x:px(s2s)-26,y:lys-8,width:22,height:14,rx:3,fill:'#fff',opacity:.95});
  svgEl(svg,'text',{x:px(s2s)-15,y:lys+3,'text-anchor':'middle','font-size':9.5,fill:'#16A34A','font-weight':700},'Δh_s');
  // Δh_a: en el proceso real (derecha de la diagonal)
  const lxr=(px(s1)+px(s2a))/2,lyr=(py(h1)+py(h2a))/2;
  svgEl(svg,'rect',{x:lxr+5,y:lyr-8,width:24,height:14,rx:3,fill:'#fff',opacity:.95});
  svgEl(svg,'text',{x:lxr+17,y:lyr+3,'text-anchor':'middle','font-size':9.5,fill:'#C84B1A','font-weight':700},'Δh_a');

  // ── Anotación s_gen > 0 ────────────────────────────────────────
  if(Math.abs(s2a-s2s)>0.02){
    const ys_ann=isTurb?py(h2s)+18:py(h2s)-20;
    svgEl(svg,'text',{
      x:(px(s2s)+px(s2a))/2,y:ys_ann,
      'text-anchor':'middle','font-size':8,fill:'#9AA0AE','font-style':'italic'
    },'← s_gen > 0 →');
  }

  // ── Leyenda ────────────────────────────────────────────────────
  svgEl(svg,'line',{x1:ML+4,y1:MT+9,x2:ML+20,y2:MT+9,stroke:'#16A34A','stroke-width':2,'stroke-dasharray':'5 3'});
  svgEl(svg,'text',{x:ML+24,y:MT+13,'font-size':9,fill:'#4A5168'},'ideal (isentrópico)');
  svgEl(svg,'line',{x1:ML+4,y1:MT+23,x2:ML+20,y2:MT+23,stroke:'#C84B1A','stroke-width':2});
  svgEl(svg,'text',{x:ML+24,y:MT+27,'font-size':9,fill:'#4A5168'},'real (η < 1)');
  svgEl(svg,'rect',{x:ML+4,y:MT+33,width:14,height:9,rx:2,fill:'#C84B1A',opacity:.2,stroke:'#C84B1A','stroke-width':.8});
  svgEl(svg,'text',{x:ML+24,y:MT+41,'font-size':9,fill:'#4A5168'},'irreversibilidad');
}

function calcXD(){
  const T0=+document.getElementById('xd-t0sl').value;
  const Sgen=+document.getElementById('xd-sgsl').value;
  const t0el=document.getElementById('xd-t0');if(t0el)t0el.textContent=T0;
  const sgel=document.getElementById('xd-sg');if(sgel)sgel.textContent=Sgen.toFixed(2);
  const Xd=T0*Sgen;
  const el=document.getElementById('xd-strip');
  if(el)el.innerHTML=`
    <div class="mchip"><div class="mval hot">${Xd.toFixed(1)}</div><div class="mlbl">X_destroyed [kJ]</div></div>
    <div class="mchip"><div class="mval jade">${Sgen.toFixed(2)}</div><div class="mlbl">S_gen [kJ/K]</div></div>
    <div class="mchip"><div class="mval cold">${T0.toFixed(0)}</div><div class="mlbl">T₀ [K]</div></div>
  `;
  drawXDbar(Xd,T0,Sgen);
}

function drawXDbar(Xd,T0,Sgen){
  const svg=document.getElementById('xd-svg');if(!svg)return;clr(svg);
  const max=T0*5;
  const frac=Math.min(1,Xd/max);
  svgEl(svg,'rect',{x:20,y:40,width:300,height:35,rx:5,fill:'#F4F5F7',stroke:'#D8DCE6'});
  svgEl(svg,'rect',{x:20,y:40,width:300*frac,height:35,rx:5,fill:'#C84B1A'});
  svgEl(svg,'text',{x:20,y:32,'font-size':11,fill:'#4A5168'},'Exergía destruida');
  svgEl(svg,'text',{x:20+300*frac+5,y:65,'font-size':11,fill:'#C84B1A','font-family':'JetBrains Mono'},Xd.toFixed(1)+' kJ');
  svgEl(svg,'text',{x:170,y:115,'text-anchor':'middle','font-size':12,fill:'#4A5168'},`X_dest = T₀ · S_gen = ${T0} × ${Sgen.toFixed(2)} = ${Xd.toFixed(1)} kJ`);
  svgEl(svg,'text',{x:170,y:140,'text-anchor':'middle','font-size':11,fill:'#16A34A'},`η_II máx = 1 (rev) → η_II = 1 - X_dest/X_in`);
}

/* ============================================================
   BRAYTON COMPUTATION
   ============================================================ */
function calcBrayton(){
const{v,rp,tmax,t1,eps,ec,et,nic,nrh}=S.br;
const k=(G-1)/G;
const hR=v.includes('reg')||v==='all';
const hRH=v.includes('rh')||v==='all';
const hIC=v.includes('ic')||v==='all';
// Number of stages: 1 if not active, N (slider) if active
const Nic=hIC?Math.max(1,nic||1):1;
const Nrh=hRH?Math.max(1,nrh||1):1;
const T1=t1,T3=tmax;
// Pressure ratio per compressor stage (optimal): rp^(1/Nic)
const rpc=Math.pow(rp,1/Nic);
const rpt=Math.pow(rp,1/Nrh);
// Per-stage isentropic temperature ratio
const tau_c=Math.pow(rpc,k);
const tau_t=Math.pow(rpt,k);
// Each compressor stage: T1 → T1·tau_c (then IC brings back to T1, except last)
const T2s_stage=T1*tau_c;
const T2_stage=T1+(T2s_stage-T1)/ec;
const T2=T2_stage; // T at exit of last compressor
// Each turbine stage: T3 → T3/tau_t (then RH back to T3)
const T4s_stage=T3/tau_t;
const T4_stage=T3-(T3-T4s_stage)*et;
const T4=T4_stage; // T at exit of last turbine
// Total compressor work: Nic stages * cp*(T2_stage-T1)
const wc=Nic*CP*(T2_stage-T1);
// Total turbine work: Nrh stages * cp*(T3-T4_stage)
const wt=Nrh*CP*(T3-T4_stage);
// Regeneration: if T4>T2 (T at exit of last turbine > T at exit of last compressor)
let T5=T2;
if(hR&&T4>T2)T5=T2+eps*(T4-T2);
// Heat input: in first combustor (T5 or T2 → T3) plus (Nrh-1) reheaters (T4_stage → T3)
let qin=hR?CP*(T3-T5):CP*(T3-T2);
if(Nrh>1)qin+=(Nrh-1)*CP*(T3-T4_stage);
const wn=wt-wc,eta=wn/qin,qo=qin-wn,bwr=wc/wt;
const te=hR?(T4-eps*(T4-T2)):T4;
// Ericsson asymptote
const eta_ericsson=1-T1/T3;
return{T1,T2,T3,T4,T5,te,wc,wt,wn,qin,qo,eta,bwr,hR,hRH,hIC,Nic,Nrh,rpc,rpt,tau_c,tau_t,T2_stage,T4_stage,eta_ericsson}
}

function calcBraytonSimple(){
const k=(G-1)/G,r=S.br.rp,T1=S.br.t1,T3=S.br.tmax;
const T2=T1*Math.pow(r,k),T4=T3/Math.pow(r,k);
const wn=CP*((T3-T4)-(T2-T1)),qi=CP*(T3-T2);
return{eta:wn/qi,wn,qi}
}

function drawBTS(d){
const svg=document.getElementById('bts');clr(svg);
const W=360,H=280,ML=48,MR=14,MT=16,MB=36;
svgEl(svg,'line',{x1:ML,y1:H-MB,x2:W-MR,y2:H-MB,stroke:'#9AA0AE'});
svgEl(svg,'line',{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:'#9AA0AE'});
svgEl(svg,'text',{x:W-MR,y:H-MB+16,'text-anchor':'end','font-size':10,fill:'#9AA0AE'},'s →');
svgEl(svg,'text',{x:ML-8,y:MT+4,'font-size':10,fill:'#9AA0AE','text-anchor':'end'},'T [K]');
const P1=1,P2=S.br.rp;
function ent(T,P){return CP*Math.log(T/d.T1)-R_AIR*Math.log(P/P1)}
// Build state list traversing multi-stage process
const st=[];
// Compression: Nic stages, each from T1 to T2_stage at increasing P
for(let i=0;i<d.Nic;i++){
  const P_in=P1*Math.pow(d.rpc,i);
  const P_out=P1*Math.pow(d.rpc,i+1);
  st.push({s:ent(d.T1,P_in),T:d.T1,P:P_in,lbl:i===0?'1':`a${i}`});
  st.push({s:ent(d.T2_stage,P_out),T:d.T2_stage,P:P_out,lbl:i===d.Nic-1?'2':`b${i}`});
  if(i<d.Nic-1){st.push({s:ent(d.T1,P_out),T:d.T1,P:P_out,lbl:`c${i}`})}
}
// Regeneration if active
if(d.hR)st.push({s:ent(d.T5,P2),T:d.T5,P:P2,lbl:'5'});
// Expansion: Nrh stages
for(let i=0;i<d.Nrh;i++){
  const P_in=P2/Math.pow(d.rpt,i);
  const P_out=P2/Math.pow(d.rpt,i+1);
  st.push({s:ent(d.T3,P_in),T:d.T3,P:P_in,lbl:i===0?'3':`d${i}`});
  st.push({s:ent(d.T4_stage,P_out),T:d.T4_stage,P:P_out,lbl:i===d.Nrh-1?'4':`e${i}`});
  if(i<d.Nrh-1){st.push({s:ent(d.T3,P_out),T:d.T3,P:P_out,lbl:`f${i}`})}
}
if(d.hR)st.push({s:ent(d.te,P1),T:d.te,P:P1,lbl:"4'"});
// Cerrar el ciclo: rechazo de calor a presión constante (P1) desde el último estado hasta el estado 1
st.push({s:ent(d.T1,P1),T:d.T1,P:P1,lbl:''});
const smin=Math.min(...st.map(s=>s.s))-.05,smax=Math.max(...st.map(s=>s.s))+.05;
const Tmax=Math.max(...st.map(s=>s.T))*1.12;
function px(s){return ML+(s-smin)/(smax-smin)*(W-ML-MR)}
function py(T){return H-MB-(T/Tmax)*(H-MT-MB)}
// Grid
[500,1000,1500,2000].forEach(T=>{if(T<Tmax){
  svgEl(svg,'line',{x1:ML,y1:py(T),x2:W-MR,y2:py(T),stroke:'#EEF0F4','stroke-width':.5});
  svgEl(svg,'text',{x:ML-4,y:py(T)+3,'text-anchor':'end','font-size':8,fill:'#9AA0AE'},T+'')
}});
// Draw cycle segments
for(let i=0;i<st.length-1;i++){
  const a=st[i],b=st[i+1];
  const hot=b.T>a.T;
  const col=hot?'#C84B1A':'#0369A1';
  if(Math.abs(a.P-b.P)<.01){
    // Isobar curve
    const pts=[];const N=20;
    for(let j=0;j<=N;j++){
      const s=a.s+(b.s-a.s)*j/N;
      const T=d.T1*Math.exp((s+R_AIR*Math.log(a.P/P1))/CP);
      pts.push(`${px(s)},${py(T)}`)
    }
    svgEl(svg,'polyline',{points:pts.join(' '),fill:'none',stroke:col,'stroke-width':2.5})
  }else{
    // Adiabatic/isentropic step
    svgEl(svg,'line',{x1:px(a.s),y1:py(a.T),x2:px(b.s),y2:py(b.T),stroke:'#1CBBBB','stroke-width':2.5})
  }
}
// Carnot envelope (Ericsson limit)
if(d.Nic>3&&d.Nrh>3){
  svgEl(svg,'line',{x1:ML,y1:py(d.T1),x2:W-MR,y2:py(d.T1),stroke:'#16A34A','stroke-width':1,'stroke-dasharray':'4 3',opacity:.5});
  svgEl(svg,'line',{x1:ML,y1:py(d.T3),x2:W-MR,y2:py(d.T3),stroke:'#16A34A','stroke-width':1,'stroke-dasharray':'4 3',opacity:.5});
  svgEl(svg,'text',{x:W-MR-4,y:py(d.T3)-3,'text-anchor':'end','font-size':9,fill:'#16A34A','font-style':'italic'},'→ Ericsson');
}
// State dots
st.forEach((s)=>{
  svgEl(svg,'circle',{cx:px(s.s),cy:py(s.T),r:3.5,fill:'#1CBBBB',stroke:'#fff','stroke-width':1.2});
});
// Label key states only
st.filter(s=>['1','2','3','4','5',"4'"].includes(s.lbl)).forEach(s=>{
  svgEl(svg,'text',{x:px(s.s)+6,y:py(s.T)-4,'font-size':10,fill:'#138F8F','font-weight':700},s.lbl);
});
}

function drawBPV(d){
  const svg=document.getElementById('bpv');if(!svg)return;clr(svg);
  const W=360,H=280,ML=48,MR=14,MT=16,MB=36;
  svgEl(svg,'line',{x1:ML,y1:H-MB,x2:W-MR,y2:H-MB,stroke:'#9AA0AE'});
  svgEl(svg,'line',{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:'#9AA0AE'});
  svgEl(svg,'text',{x:W-MR,y:H-MB+16,'text-anchor':'end','font-size':10,fill:'#4A5168'},'v [m³/kg]');
  svgEl(svg,'text',{x:ML-8,y:MT+4,'font-size':10,fill:'#4A5168','text-anchor':'end'},'P [atm]');
  const P1=1,P2=S.br.rp;
  // Build state list with multi-stage
  const st=[];
  // Compression
  for(let i=0;i<d.Nic;i++){
    const Pin=P1*Math.pow(d.rpc,i);
    const Pout=P1*Math.pow(d.rpc,i+1);
    st.push({P:Pin,T:d.T1,v:R_AIR*d.T1/(Pin*100)});
    st.push({P:Pout,T:d.T2_stage,v:R_AIR*d.T2_stage/(Pout*100)});
    if(i<d.Nic-1)st.push({P:Pout,T:d.T1,v:R_AIR*d.T1/(Pout*100)});
  }
  if(d.hR)st.push({P:P2,T:d.T5,v:R_AIR*d.T5/(P2*100)});
  // Expansion
  for(let i=0;i<d.Nrh;i++){
    const Pin=P2/Math.pow(d.rpt,i);
    const Pout=P2/Math.pow(d.rpt,i+1);
    st.push({P:Pin,T:d.T3,v:R_AIR*d.T3/(Pin*100)});
    st.push({P:Pout,T:d.T4_stage,v:R_AIR*d.T4_stage/(Pout*100)});
    if(i<d.Nrh-1)st.push({P:Pout,T:d.T3,v:R_AIR*d.T3/(Pout*100)});
  }
  if(d.hR)st.push({P:P1,T:d.te,v:R_AIR*d.te/(P1*100)});
  // Cerrar el ciclo: rechazo de calor isobárico desde el último estado hasta el estado 1
  st.push({P:P1,T:d.T1,v:R_AIR*d.T1/(P1*100)});
  // Bounds
  const vmin=Math.min(...st.map(s=>s.v))*0.7,vmax=Math.max(...st.map(s=>s.v))*1.1;
  const Pmax=Math.max(...st.map(s=>s.P))*1.15;
  function px(v){return ML+(v-vmin)/(vmax-vmin)*(W-ML-MR)}
  function py(P){return H-MB-(P/Pmax)*(H-MT-MB)}
  // Grid
  [P1,P2,P2/2].forEach((P,i)=>{
    svgEl(svg,'line',{x1:ML,y1:py(P),x2:W-MR,y2:py(P),stroke:'#EEF0F4','stroke-width':.5});
    svgEl(svg,'text',{x:ML-4,y:py(P)+3,'text-anchor':'end','font-size':8,fill:'#9AA0AE'},P.toFixed(0));
  });
  // Draw segments
  for(let i=0;i<st.length-1;i++){
    const a=st[i],b=st[i+1];
    if(Math.abs(a.P-b.P)<.01){
      // Isobar
      svgEl(svg,'line',{x1:px(a.v),y1:py(a.P),x2:px(b.v),y2:py(b.P),stroke:b.T>a.T?'#C84B1A':'#0369A1','stroke-width':2.5});
    }else if(Math.abs(a.T-b.T)<.5){
      // Isothermal (intercool/reheat)
      svgEl(svg,'line',{x1:px(a.v),y1:py(a.P),x2:px(b.v),y2:py(b.P),stroke:'#0891B2','stroke-width':2,'stroke-dasharray':'4 3'});
    }else{
      // Adiabatic (Pv^γ = const)
      const K=a.P*Math.pow(a.v,G);
      const pts=[];const N=20;
      for(let j=0;j<=N;j++){
        const v=a.v+(b.v-a.v)*j/N;
        const P=K/Math.pow(v,G);
        pts.push(`${px(v)},${py(P)}`);
      }
      svgEl(svg,'polyline',{points:pts.join(' '),fill:'none',stroke:'#1CBBBB','stroke-width':2.5});
    }
  }
  // State dots
  st.forEach(s=>{
    svgEl(svg,'circle',{cx:px(s.v),cy:py(s.P),r:3,fill:'#1CBBBB',stroke:'#fff','stroke-width':1});
  });
}

function drawBSchema(d){
  const svg=document.getElementById('bs');if(!svg)return;clr(svg);
  // Build component list based on variant + multi-stages
  const comps=[];
  const CC_COL='#C84B1A',COMP_COL='#0369A1',TURB_COL='#16A34A',REG_COL='#1CBBBB',IC_COL='#0891B2';
  // Inlet
  comps.push({type:'flow',label:'aire',col:COMP_COL});
  // Compression: Nic stages
  for(let i=0;i<d.Nic;i++){
    comps.push({type:'comp',label:d.Nic>1?`C${i+1}`:'Compr.',col:COMP_COL,sub:d.Nic>1?`r_p^{1/${d.Nic}}`:''});
    if(i<d.Nic-1)comps.push({type:'ic',label:'IC',col:IC_COL,sub:'→T₁'});
  }
  if(d.hR)comps.push({type:'reg',label:'Regen',col:REG_COL,sub:`ε=${(S.br.eps*100).toFixed(0)}%`});
  // Combustion + Reheating
  comps.push({type:'cc',label:'CC',col:CC_COL,sub:'→T₃'});
  for(let i=0;i<d.Nrh;i++){
    comps.push({type:'turb',label:d.Nrh>1?`T${i+1}`:'Turb.',col:TURB_COL,sub:d.Nrh>1?`r_p^{1/${d.Nrh}}`:''});
    if(i<d.Nrh-1)comps.push({type:'rh',label:'RH',col:CC_COL,sub:'→T₃'});
  }
  // Output
  comps.push({type:'flow',label:d.hR?'→regen':'escape',col:CC_COL});
  // Layout
  const N=comps.length,padding=20;
  const totalW=720,boxW=Math.min(70,Math.max(40,(totalW-padding*2-20*(N-1))/N));
  const cy=120;
  let x=padding;
  comps.forEach((co,i)=>{
    if(co.type==='flow'){
      svgEl(svg,'text',{x:x+25,y:cy+4,'font-size':10,fill:co.col,'font-weight':500},co.label);
      x+=50;return;
    }
    const h=co.type==='cc'||co.type==='reg'?54:48;
    const cx=x+boxW/2,cyc=cy-2;
    if(co.type==='comp'){
      // wide at inlet (left=LP), narrow at outlet (right=HP) — converging flow
      svgEl(svg,'polygon',{points:`${x},${cy-h/2} ${x+boxW},${cy-h/3} ${x+boxW},${cy+h/3} ${x},${cy+h/2}`,fill:'#f0f9ff',stroke:co.col,'stroke-width':2.5});
    }else if(co.type==='turb'){
      // narrow at inlet (left=HP), wide at outlet (right=LP) — expanding flow
      svgEl(svg,'polygon',{points:`${x},${cy-h/3} ${x+boxW},${cy-h/2} ${x+boxW},${cy+h/2} ${x},${cy+h/3}`,fill:'#f0fdf4',stroke:co.col,'stroke-width':2.5});
    }else{
      svgEl(svg,'rect',{x,y:cy-h/2,width:boxW,height:h,rx:5,fill:'#fff',stroke:co.col,'stroke-width':2.5});
      if(co.type==='cc'||co.type==='rh'){
        svgEl(svg,'circle',{cx,cy:cyc,r:9,fill:co.col,opacity:.25});
        svgEl(svg,'text',{x:cx,y:cyc+4,'text-anchor':'middle','font-size':12,fill:co.col},'🔥');
      }else if(co.type==='ic'){
        svgEl(svg,'path',{d:`M${cx-9},${cyc} Q${cx-4.5},${cyc-4} ${cx},${cyc} T${cx+9},${cyc}`,fill:'none',stroke:co.col,'stroke-width':1.5});
        svgEl(svg,'path',{d:`M${cx-9},${cyc+5} Q${cx-4.5},${cyc+1} ${cx},${cyc+5} T${cx+9},${cyc+5}`,fill:'none',stroke:co.col,'stroke-width':1.5});
      }else if(co.type==='reg'){
        svgEl(svg,'rect',{x:cx-9,y:cyc-7,width:18,height:14,rx:2,fill:'none',stroke:co.col,'stroke-width':1.5});
        svgEl(svg,'line',{x1:cx-9,y1:cyc,x2:cx+9,y2:cyc,stroke:co.col,'stroke-width':1.5});
      }
    }
    svgEl(svg,'text',{x:cx,y:cy+4,'text-anchor':'middle','font-size':10,fill:co.col,'font-weight':700},co.label);
    if(co.sub)svgEl(svg,'text',{x:cx,y:cy+h/2+12,'text-anchor':'middle','font-size':8,fill:'#9AA0AE'},co.sub);
    x+=boxW;
    // Arrow to next
    if(i<N-1){
      const next=comps[i+1];
      if(next.type!=='flow'){
        svgEl(svg,'line',{x1:x,y1:cy,x2:x+18,y2:cy,stroke:'#4A5168','stroke-width':1.5});
        svgEl(svg,'polygon',{points:`${x+14},${cy-3} ${x+19},${cy} ${x+14},${cy+3}`,fill:'#4A5168'});
      }
      x+=20;
    }
  });
  // Title
  document.getElementById('bs-sub').textContent=BV.find(b=>b.k===S.br.v)?.l||'';
}

const braytonTheories={
simple:`<h3>Ciclo Brayton simple</h3><div class="fm">η = 1 − 1/r<sub>p</sub><sup>(γ−1)/γ</sup></div><p>η solo depende de r<sub>p</sub> (ideal). w<sub>neto</sub> tiene máximo vs r<sub>p</sub>. BWR≈0.4-0.6 (vs ≈0.01 en Rankine).</p>`,
reg:`<h3>Con regeneración</h3><p>Gases de escape calientan aire comprimido antes de CC. <strong>Si T4>T2</strong>: q<sub>in</sub>↓ → η↑. w<sub>neto</sub> no cambia. Más eficaz a baja r<sub>p</sub>.</p><div class="fm">ε = (T5−T2)/(T4−T2)   →   η<sub>reg</sub> = 1 − (T1/T3)·r<sub>p</sub><sup>(γ−1)/γ</sup> (ε=1)</div>`,
rh:`<h3>Con recalentamiento</h3><p>Expansión en 2 turbinas con CC intermedia. ↑↑w<sub>neto</sub>. <strong>η baja sin regen</strong> porque T̄<sub>ap</sub> baja. ↑T4 → más potencial regenerativo.</p>`,
ic:`<h3>Con intercooling</h3><p>Compresión en 2 etapas con refrigeración intermedia. ↓w<sub>compr</sub> → ↑w<sub>neto</sub>. <strong>η baja sin regen</strong> porque T2↓ → T̄<sub>ap</sub> baja. ↓T2 → más potencial regenerativo.</p>`,
'reg+rh':`<h3>Regen + recalentamiento</h3><p>Reheating eleva T4 → amplifica efecto del regenerador. ↑↑η + ↑↑w<sub>neto</sub>.</p>`,
'reg+ic':`<h3>Regen + intercooling</h3><p>IC baja T2 → amplifica regeneración (ΔT mayor). ↑↑η + ↑↑w<sub>neto</sub>.</p>`,
'rh+ic':`<h3>Reheat + intercooling (sin regen)</h3><p>Maximiza w<sub>neto</sub> pero η peor que simple. Solo interesa si se busca máxima potencia específica.</p>`,
all:`<h3>Las tres → ≈ Ericsson</h3><p>Con ∞ etapas IC + ∞ etapas RH + ε=1 → ciclo de Ericsson: dos isotermas + dos isobaras.</p><div class="fm">η<sub>Ericsson</sub> = η<sub>Carnot</sub> = 1 − T1/T3</div>`
};

function calcAviation(){
const{v,mach,bpr,rpc}=S.av;const V0=mach;
let Vj,eTh,eP,eG,reg;
switch(v){
  case'turbojet':Vj=2.5;eTh=Math.min(.55,.35+.005*(rpc-10));break;
  case'afterburner':Vj=3.5;eTh=.18;break;
  case'turbofan':Vj=Math.max(1.05*V0,1.8-.06*bpr);eTh=Math.min(.55,.40+.003*(rpc-25));break;
  case'turboprop':Vj=1.2;eTh=.34;break;
  case'turboshaft':Vj=1;eTh=.32;break;
  case'ramjet':Vj=4+mach;eTh=mach>1?.30+.05*(mach-1):.05;break;
  case'scramjet':Vj=6+mach;eTh=mach>3?.50:.05;break;
  default:Vj=2;eTh=.35
}
eP=V0>.05?Math.max(0,Math.min(1,2/(1+Vj/Math.max(V0,.01)))):0;
eG=eTh*eP;
reg={turbojet:'M 0.8–2.5',afterburner:'M 0.8–3 (combate)',turbofan:'M 0.7–0.9 (alto BPR)',turboprop:'M 0.4–0.65',turboshaft:'V baja (helicópteros)',ramjet:'M 1–5',scramjet:'M 3–10+'}[v]||'';
return{Vj,eTh,eP,eG,V0,reg}
}

  const CC='#C84B1A',COMP='#0369A1',TURB='#16A34A',FAN='#1CBBBB',NOZ='#FBBF24';

  function arr(x,y,len,col,lbl){

    svgEl(m,'path',{d:'M0,0 L10,5 L0,10 z',fill:col});

  // Diffuser inlet helper: narrow air-entry (left) → wide compressor face (right)

  }
  function nozzleCone(x0,y0,h,convdiv){
    if(convdiv){
      // Converging-diverging (afterburner)
      svgEl(svg,'polygon',{points:`${x0},${y0-h/3} ${x0+15},${y0-h/4} ${x0+30},${y0-h/3} ${x0+30},${y0+h/3} ${x0+15},${y0+h/4} ${x0},${y0+h/3}`,fill:'#FEE2E2',stroke:'#DC2626','stroke-width':1.5});
    }else{
      svgEl(svg,'polygon',{points:`${x0},${y0-h/3} ${x0+30},${y0-h/4} ${x0+30},${y0+h/4} ${x0},${y0+h/3}`,fill:'#FEF3C7',stroke:'#D97706','stroke-width':1.5});
    }
